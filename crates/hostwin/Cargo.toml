[package]
name = "acde-hostwin"
version.workspace = true
edition.workspace = true

[dependencies]
acdert = { path = "../../../libacde" }
serde_json = "1"
log = "0"
pollster = "0"
url = "2"

[target.'cfg(not(windows))'.dependencies]
winit = "0"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# notify.rs: native notifications through org.freedesktop.Notifications when no visible desktop shows them; approve.rs: the approval
# prompt is such a notification with Allow / Don't Allow actions
zbus = "5"

# chooser.rs: the folder, open and save choosers are AppKit's open and save panels, shown on the winit main thread; approve.rs: the
# approval prompt is an NSAlert sheet on the host window;
# a page's accepted types become the open panel's UTTypes; languages.rs: the user's preferred languages (NSLocale)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSLocale", "NSOperation", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-uniform-type-identifiers", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSView"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
