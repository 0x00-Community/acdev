[package]
name = "acde-window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
acde-model = { path = "../model" }
acde-paint = { path = "../paint" }
acde-render = { path = "../render" }
acde-log = { path = "../log" }
log = "0"
smithay-client-toolkit = "0"
wayland-client = "0"
wayland-backend = "0"
wayland-scanner = "0"
bitflags = "2"
wayland-protocols = { version = "0", features = ["client", "staging"] }
rustix = { version = "1", features = ["fs", "event", "pipe"] }
smithay = { version = "0", default-features = false, features = ["backend_gbm"] }
