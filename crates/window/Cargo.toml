[package]
name = "acde-window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
acde-model = { path = "../model" }
acde-paint = { path = "../paint" }
acde-render = { path = "../render" }
acde-log = { path = "../log" }
log = "0.4"
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
bitflags = "2"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
rustix = { version = "1", features = ["fs", "event", "pipe"] }
smithay = { version = "0.7.0", default-features = false, features = ["backend_gbm"] }
