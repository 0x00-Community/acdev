[package]
name = "acde-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# napi 类 Shell: crates/acde 开 (它的 V8 宿主实现 Node-API)
napi = ["dep:napi", "dep:napi-derive", "dep:wayland-client", "dep:wayland-backend", "dep:rustix", "acde-model/napi"]

[dependencies]
# canvas / window 的模型 (纯数据, 不依赖 Wayland / 渲染)
acde-model = { path = "../model" }
# acde_window 协议 (crates/model/protocol/acde-window.xml) 的服务端代码
wayland-scanner = "0.31"
bitflags = "2"
# napi: 和 crates/runtime 同版本
napi = { version = "=3.14.2", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "=3.6.12", optional = true }
# napi Shell 是 acde_shell 协议的客户端 (经 socketpair 连合成器); 和 crates/window 同版本
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true }
# napi Shell 的读线程: poll 连接和停止管道 (退出时先停读线程, 合成器再关连接)
rustix = { version = "1", features = ["event", "pipe"], optional = true }
smithay = { version = "0.7.0", default-features = false, features = [
	"backend_gbm", "backend_drm", "backend_libinput", "backend_udev", "backend_session_libseat", "backend_egl", "renderer_gl", "use_system_lib",
	"wayland_frontend", "desktop",
] }
# 日志走 log, 由宿主 (crates/acde) 用 acde-log 装 env_logger; smithay 打的 tracing 事件经 tracing 的 log feature 转成 log
log = "0.4"
tracing = { version = "0.1", features = ["log"] }
acde-log = { path = "../log" }
# DRM 后端的软件光标: 读系统光标主题
xcursor = "0.3"
# 截屏存 PNG
png = "0.18"
# RDP 后端 (ACDE_BACKEND=rdp): 合成结果作为远程桌面发给 RDP 客户端, 键鼠从客户端回来. 服务端是 vendors/ironrdp-server
# (改成跑在 ntex 上, TLS 用 OpenSSL), 在自己的线程上跑一个 ntex System. ntex 的版本和 feature 跟 crates/runtime 一致 (不选运行时: Linux 上先 io_uring, 不行用 polling)
ironrdp-server = { version = "0.13", features = ["helper"] }
ntex = { version = "4.4", features = ["openssl"] }
async-channel = "2"
async-trait = "0.1"
anyhow = "1"
