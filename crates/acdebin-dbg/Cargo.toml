[package]
name = "acdebin-dbg"
version.workspace = true
edition.workspace = true

[[bin]]
name = "acdebin-dbg"
path = "src/main.rs"

[dependencies]
acdert = { path = "../../../acdert" }
acde-hostwin = { path = "../hostwin" }
# doctor.rs: draws a test frame on the GPU
log = "0"
serde_json = "1"
# hostnative.rs: the dev IPC's shot carries the PNG as base64
base64 = "0"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0"
