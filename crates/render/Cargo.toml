[package]
name = "acde-render"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0"
data-url = "0"
# blitz 版本由这里钉死并 pub use, paint / window / acde 只经 acde_render 引用
# complex-scripts: 中文/日文断行 (ICU4X 分词模型); floats: CSS float
blitz-dom = { workspace = true, features = [
    "svg",
    "woff",
    "system-fonts",
    "file-input",
    "text-transform-icu",
    "complex-scripts",
    "floats",
] }
blitz-paint = { workspace = true, default-features = true, features = ["scrollbars"] }
blitz-traits = { workspace = true, default-features = true }
# 和 blitz-dom (acrender) 用的同一份 stylo, 读 overflow / visibility
stylo = "=0.22.0"
acde-gpu.workspace = true
# blitz-dom (acrender) 用的 parley, 取插入点几何
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
# 2D 场景用的 kurbo, 算脏区域的包围盒
kurbo = "0"
# 2D 场景用的 peniko, 看图层的合成方式 (region.rs)
peniko = "0"
# canvas 的 toDataURL 编 PNG
png = "0"
# 文字的字形坐标 (parley 和 acde-gpu 的 NormalizedCoord) 按位转, 和 blitz-paint 一样
bytemuck = "1"
# 文档锁: JS 线程和 render 线程共用文档 (MutexGuard::bump 让锁给等着的线程)
parking_lot = "0"
# 日志和全链路计时: 帧的耗时, 输入到上屏的 Trace 跟着 Frame 走
acde-log.workspace = true
log = "0"
# Dom 的 HTML 解析 (和 stylo 的 web_atoms 同版本; 自己的 TreeSink: scripting 开着、留 doctype、片段不挂到文档上)
html5ever = "=0.40.1"
# 和 blitz-dom 同版本: ElementState (:focus-visible / :active / :checked), matchMedia 的媒体查询解析
style_dom = { version = "=0.22.0", package = "stylo_dom" }
style_traits = { version = "=0.22.0", package = "stylo_traits" }
cssparser = "=0.38.0"
# Dom::semantics 的 JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# tests: render 自己不带合成器, 测试装 vello 的那份
acde-vello.workspace = true
# tests/svg_fixtures.rs 把 SVG 文件读成 DOM 调用
roxmltree = "0"
# tests/replay.rs 解压录下的 op 流 (已在依赖树里, 不新增下载)
flate2 = "1"

[features]
# Blitz 把 resolve 里 style / construct / layout / paint_tree 各步耗时打到 stdout, 测性能用
phase-times = ["blitz-dom/log-phase-times"]
