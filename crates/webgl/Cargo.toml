[package]
name = "acde-webgl"
version.workspace = true
edition.workspace = true

[dependencies]
acde-gpu = { path = "../gpu" }
# shaders: GLSL ES through the vendored naga's WebGL dialect (vendor/naga), handed to wgpu as IR
naga = { version = "30", features = ["glsl-in"] }
wgpu = { version = "30", default-features = false, features = ["naga-ir"] }
peniko = "0"
# error scopes around wgpu calls resolve synchronously
pollster = "0"
log = "0"

[dev-dependencies]
env_logger = "0"
naga = { version = "30", features = ["glsl-in", "msl-out", "spv-out", "hlsl-out"] }
