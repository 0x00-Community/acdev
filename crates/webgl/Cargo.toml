[package]
name = "acde-webgl"
version.workspace = true
edition.workspace = true

[dependencies]
acde-gpu.workspace = true
# shaders: GLSL ES through src/glsl (naga's GLSL frontend with the WebGL dialect), handed to wgpu as IR
naga = "30"
pp-rs = "0"
half = "2"
thiserror = { version = "2", default-features = false }
bitflags = "2"
wgpu = { version = "30", default-features = false, features = ["naga-ir"] }
peniko = "0"
# error scopes around wgpu calls resolve synchronously
pollster = "0"
log = "0"

[dev-dependencies]
env_logger = "0"
naga = { version = "30", features = ["msl-out", "spv-out", "hlsl-out"] }
