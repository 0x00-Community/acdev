[package]
name = "acde-gpu"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kurbo = "0"
peniko = "0"
vello = { version = "0", default-features = false, features = ["wgpu"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }
pollster = "0"
log = "0"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "static-dxc"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"] }
ash = "0"
rustix = { version = "1", features = ["event"] }
