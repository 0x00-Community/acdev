[package]
name = "acde-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
# logging (the host installs env_logger through acde-log)
log = "0"
# napi: 和 agentrt-rust/crates/napi 同版本
napi = { version = "3", default-features = false, features = ["napi8", "async-runtime", "serde-json"] }
napi-derive = "3"
# local time of the names of new Office documents
jiff = "0"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# the executor (rt.rs; ntex picks io_uring, else polling, at run time), the HTTP/WebSocket client and servers
ntex = { version = "4", features = ["openssl"] }
# TLS of ntex's HTTP client (http.rs: a connector that verifies the peer)
openssl = "0"
# executor-independent async pieces (channels, block_on)
async-channel = "2"
futures-lite = "2"
futures-channel = "0"
# accepting on the servers' Unix sockets (ntex has no listener outside ntex-server)
async-io = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
# String.prototype.localeCompare (ICU, Node's default locale) for the Finder's sort order
icu_collator = "2"
icu_locale_core = "2"
url = "2"
sha2 = "0"
futures-util = { version = "0", default-features = false, features = ["sink", "std"] }
base64 = "0"
rand = "0"
# the Office app (app-office): Document Server JWTs and bridge tickets
hmac = "0"
# gzip of the speech recognition device registration
flate2 = "1"

# Linux desktop services: D-Bus (input method, NetworkManager, portals, AT-SPI, the session bus, BlueZ) and PipeWire (voice, acde:audio)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# acde:input 的 catalog(): xkeyboard-config 的 rules/evdev.xml
roxmltree = "0"
pipewire = { version = "0", features = ["v0_3_49"] }

# unix: the pty, the terminal's poll loop, signals and process groups, O_NOFOLLOW, ELOOP
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "fs", "process", "pty", "termios"] }
# pty.rs: close_range in the terminal shell's child (rustix has none), so it inherits no fd of the runtime;
# terminal/unix.rs: getpwuid_r for the account's login shell
libc = "0"

# Windows: what std has no API for (not following a symlink when opening; a TLS chain whose root Windows has not downloaded yet;
# the proxy of the user's Internet settings, WinHTTP; the terminal's pseudo console, its job object and pipes)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# fetch.rs tests: a test server on an AF_UNIX socket (std has no Windows listener)
[target.'cfg(windows)'.dev-dependencies]
socket2 = { version = "0", features = ["all"] }

# macOS / Windows: OpenSSL built in, the program does not depend on one installed; the system's root certificates for it
[target.'cfg(not(target_os = "linux"))'.dependencies]
openssl = { version = "0", features = ["vendored"] }
rustls-native-certs = "0"
