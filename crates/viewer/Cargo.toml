[package]
name = "acdev-viewer"
version = "0.1.0"
edition = "2024"
description = "The acdev emulator's own window on a QEMU guest: QEMU's D-Bus display, peer to peer over QMP"
publish = false

[workspace]

[dependencies]
log = "0.4"
rustix = { version = "1", features = ["net"] }
serde_bytes = "0.11"
softbuffer = "0.4"
winit = "0.30"
zbus = { version = "5", features = ["p2p", "serde_bytes"] }

[profile.release]
opt-level = "s"
strip = true
