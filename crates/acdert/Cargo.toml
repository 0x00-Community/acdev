[package]
name = "acdert"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "acdert"
path = "src/main.rs"

[dependencies]
v8 = "152"
acde-napi = { path = "../acde-napi" }
acde-render = { path = "../render" }
acde-gpu = { path = "../gpu" }
# WebGL (webgl.rs): the GL state machine on the shared wgpu device
acde-webgl = { path = "../webgl" }
acde-model = { path = "../model" }
acde-runtime = { path = "../runtime" }
# web storage (storage.rs): localStorage shared by the webs of one app or desktop, kept in SQLite
acde-storage = { path = "../storage" }
# <video> (audio/video.rs): decoding through GStreamer (Linux) or AVFoundation (macOS)
acde-media = { path = "../media" }
url = "2"
encoding_rs = "0"
getrandom = "0"
# sys.rs: package.json of node_modules packages; webgpu/: descriptors
serde_json = "1"
# sys.rs, child.rs, main.rs, supervise.rs: the socket lock, kill, uid, pre_exec of spawned children, waiting for acde runtime
rustix = { version = "1", features = ["fs", "process", "stdio", "event", "thread"] }
# sys.rs: SIGINT, SIGTERM and SIGHUP for the host's handlers
signal-hook = "0"
# sound (audio/): files decoded in pure Rust; the output is PipeWire on Linux, cpal elsewhere
symphonia = { version = "0", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac", "aac", "isomp4"] }
# logging: env_logger behind acde-log (written on its own thread), perf timings for the whole chain
acde-log = { path = "../log" }
log = "0"
# hostnative.rs: the dev IPC's shot carries the PNG as base64
base64 = "0"

# runtime, shell (smithay) and their napi exports build on Linux only; elsewhere acde runs scripts without them
# (development checks on a Mac)
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0"
acde-shell = { path = "../shell", features = ["napi"] }
acde-window = { path = "../window" }
# WebGPU (webgpu/): descriptors come as JSON, read into wgpu-types (its serde names are WebGPU's)
wgpu-types = { version = "30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
pollster = "0"
# sound (audio/): a web's graph and <audio>s rendered natively into a PipeWire stream
pipewire = { version = "0", features = ["v0_3_49"] }

# sound (audio/output_cpal.rs): CoreAudio on macOS, WASAPI on Windows
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console"] }

# languages.rs: the user's preferred languages (NSLocale)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSLocale", "NSString"] }
