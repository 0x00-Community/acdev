<!doctype html>
<!-- 毛玻璃最小测试页 (给 shell 调 backdrop-filter 合成): 花纹背景上盖一块 blur(20px) saturate(1.8) 的圆角卡片,
     卡片后面还有一个带 drop-shadow 的块. 在 Firefox 里打开就是参考效果; tests/layers.rs 用同样的 DOM. -->
<html>
<head>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background:
      repeating-linear-gradient(45deg, #ff3d7f 0 20px, #ffd23d 20px 40px, #3dd2ff 40px 60px),
      #fff;
  }
  .card {
    position: absolute; left: 50px; top: 40px; width: 200px; height: 120px; border-radius: 16px;
    background: rgba(255, 255, 255, .25);
    backdrop-filter: blur(20px) saturate(1.8);
    font: 600 20px sans-serif; color: #1d1d1f; display: flex; align-items: center; justify-content: center;
  }
  .shadow {
    position: absolute; left: 300px; top: 60px; width: 80px; height: 80px; border-radius: 12px; background: #fff;
    filter: drop-shadow(0 8px 10px rgba(40, 16, 80, .45));
  }
</style>
</head>
<body><div class="card">毛玻璃</div><div class="shadow"></div></body>
</html>
