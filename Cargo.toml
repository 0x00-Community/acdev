[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendors"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dopamine-org/acde-base"
publish = false

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

# acrender: 我们的 Blitz 分叉 (vendors/acrender, 基于上游 main 独立维护), 整组 blitz crate 都用它
[patch.crates-io]
blitz-dom = { path = "vendors/acrender/packages/blitz-dom" }
blitz-paint = { path = "vendors/acrender/packages/blitz-paint" }
blitz-traits = { path = "vendors/acrender/packages/blitz-traits" }
parley = { path = "vendors/parley" }
fontique = { path = "vendors/fontique" }
stylo = { path = "vendors/stylo" }
stylo_atoms = { path = "vendors/stylo_atoms" }
vello_cpu = { path = "vendors/vello_cpu" }
vello = { path = "vendors/vello" }
# RDP 后端的服务端: 改成跑在 ntex 上 (没有 tokio / reqwest), TLS 用 OpenSSL (见 AGENTS.md 的 vendors/ironrdp-server)
ironrdp-server = { path = "vendors/ironrdp-server" }
