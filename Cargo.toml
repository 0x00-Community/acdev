[workspace]
resolver = "3"
# crates/*: the host window. acdert/ (the runtime library the guest's acdebin-system links) is a member as a path
# dependency of the root package, not listed here: a listed member overrides exclude for every path under it, so
# acdert/vendor/blitz would be loaded into this workspace and its crates' rust-version.workspace would fail
members = ["crates/*"]
# npm/: the acde CLI (bun); acdert/vendor: the blitz fork (submodule), not built as members
exclude = ["npm", "acdert/vendor", "crates/devd"]

[workspace.package]
version = "0.0.11"
edition = "2024"
repository = "http://gitea.dopamine/AC/acdev"
publish = false

[workspace.dependencies]
# blitz: our fork (submodule acdert/vendor/blitz, Gitea AC/blitz), published to ac with the same names
blitz-dom = { path = "acdert/vendor/blitz/packages/blitz-dom", version = "=0.3.0-beta.5", registry = "ac", default-features = false }
blitz-paint = { path = "acdert/vendor/blitz/packages/blitz-paint", version = "=0.3.0-beta.5", registry = "ac", default-features = false }
blitz-traits = { path = "acdert/vendor/blitz/packages/blitz-traits", version = "=0.3.0-beta.5", registry = "ac", default-features = false }

[package]
name = "acdev"
version.workspace = true
edition.workspace = true

[dependencies]
acdert = { path = "acdert" }
acde-hostwin = { path = "crates/hostwin" }
# doctor.rs: draws a test frame on the GPU
log = "0"
serde_json = "1"
# hostnative.rs: the dev IPC's shot carries the PNG as base64
base64 = "0"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
debug = 0
strip = true
lto = "thin"

[profile.dist]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
lto = "fat"
codegen-units = 1
