[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.9"
edition = "2024"
repository = "http://gitea.dopamine/AC/acde-dbg"
publish = false

# acdert 和本仓库并排检出 (../acdert); vendors 用 acdert 的那份
[patch.crates-io]
async-dnssd = { path = "../acdert/vendors/async-dnssd" }
blitz-dom = { path = "../acdert/vendors/acrender/packages/blitz-dom" }
blitz-paint = { path = "../acdert/vendors/acrender/packages/blitz-paint" }
blitz-traits = { path = "../acdert/vendors/acrender/packages/blitz-traits" }
fontique = { path = "../acdert/vendors/fontique" }
# 不依赖 winapi (见 AGENTS.md 的 vendors/fslock、vendors/async-dnssd)
fslock = { path = "../acdert/vendors/fslock" }
# RDP 后端的服务端: 改成跑在 ntex 上 (没有 tokio / reqwest), TLS 用 OpenSSL (见 AGENTS.md 的 vendors/ironrdp-server)
ironrdp-server = { path = "../acdert/vendors/ironrdp-server" }
# libseat 运行时 dlopen, 机器上没有 libseat 也能起 (见 AGENTS.md 的 vendors/libseat-sys)
libseat-sys = { path = "../acdert/vendors/libseat-sys" }
# WebGL (crates/webgl): naga with a GLSL ES dialect in its GLSL frontend (见 AGENTS.md 的 vendors/naga)
naga = { path = "../acdert/vendors/naga" }
parley = { path = "../acdert/vendors/parley" }
stylo = { path = "../acdert/vendors/stylo" }
stylo_atoms = { path = "../acdert/vendors/stylo_atoms" }
vello = { path = "../acdert/vendors/vello" }

[profile.release]
opt-level = "s"
debug = 0
strip = true
lto = "thin"

[profile.dist]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
lto = "fat"
codegen-units = 1
