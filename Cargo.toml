[workspace]
resolver = "3"
members = ["crates/*"]
# cli/: the developer CLI (bun); cli/exe is its own small crate (the Windows acde.exe)
exclude = ["cli"]

[workspace.package]
version = "0.0.9"
edition = "2024"
repository = "http://gitea.dopamine/AC/acdebin-dbg"
publish = false

[patch.crates-io]
# blitz: our fork (submodule ../acdert/vendor/blitz, GitHub Jabberwocky238/blitz)
blitz-dom = { path = "../acdert/vendor/blitz/packages/blitz-dom" }
blitz-paint = { path = "../acdert/vendor/blitz/packages/blitz-paint" }
blitz-traits = { path = "../acdert/vendor/blitz/packages/blitz-traits" }
ironrdp-server = { path = "../acdert/vendor/ironrdp-server" }
naga = { path = "../acdert/vendor/naga" }

[profile.release]
opt-level = "s"
debug = 0
strip = true
lto = "thin"

[profile.dist]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
lto = "fat"
codegen-units = 1
