[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendors"]

[workspace.package]
version = "0.0.9"
edition = "2024"
repository = "https://github.com/dopame-org/acdert"
publish = false

# acrender: 我们的 Blitz 分叉 (vendors/acrender, 基于上游 main 独立维护), 整组 blitz crate 都用它
[patch.crates-io]
async-dnssd = { path = "vendors/async-dnssd" }
blitz-dom = { path = "vendors/acrender/packages/blitz-dom" }
blitz-paint = { path = "vendors/acrender/packages/blitz-paint" }
blitz-traits = { path = "vendors/acrender/packages/blitz-traits" }
fontique = { path = "vendors/fontique" }
# 不依赖 winapi (见 AGENTS.md 的 vendors/fslock、vendors/async-dnssd)
fslock = { path = "vendors/fslock" }
# RDP 后端的服务端: 改成跑在 ntex 上 (没有 tokio / reqwest), TLS 用 OpenSSL (见 AGENTS.md 的 vendors/ironrdp-server)
ironrdp-server = { path = "vendors/ironrdp-server" }
# libseat 运行时 dlopen, 机器上没有 libseat 也能起 (见 AGENTS.md 的 vendors/libseat-sys)
libseat-sys = { path = "vendors/libseat-sys" }
parley = { path = "vendors/parley" }
stylo = { path = "vendors/stylo" }
stylo_atoms = { path = "vendors/stylo_atoms" }
vello = { path = "vendors/vello" }

[profile.release]
opt-level = "s"
debug = 0
strip = true
lto = "thin"

[profile.dist]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
lto = "fat"
codegen-units = 1
