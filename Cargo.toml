[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.0.9"
edition = "2024"
repository = "https://github.com/dopame-org/acdert"
publish = false

# 对外唯一的包: 平铺导出 crates/* (Rust 用 rlib), 并以 cdylib 出 libacdert.so (C 接口在 src/ffi.rs, 头文件 include/acdert.h 由 build.rs 经 cbindgen 生成)
[package]
name = "acdert"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
acde-host = { path = "crates/host" }
acde-gpu = { path = "crates/gpu" }
acde-log = { path = "crates/log" }
acde-media = { path = "crates/media" }
acde-model = { path = "crates/model" }
acde-napi = { path = "crates/acde-napi" }
acde-render = { path = "crates/render" }
acde-runtime = { path = "crates/runtime" }
acde-storage = { path = "crates/storage" }
acde-vello = { path = "crates/vello" }
acde-webgl = { path = "crates/webgl" }

[features]
napi = ["acde-model/napi"]

[build-dependencies]
cbindgen = { version = "0", default-features = false }

[patch.crates-io]
# blitz: our fork (submodule vendor/blitz, GitHub Jabberwocky238/blitz)
blitz-dom = { path = "vendor/blitz/packages/blitz-dom" }
blitz-paint = { path = "vendor/blitz/packages/blitz-paint" }
blitz-traits = { path = "vendor/blitz/packages/blitz-traits" }
ironrdp-server = { path = "vendor/ironrdp-server" }

[profile.release]
opt-level = "s"
debug = 0
strip = true
lto = "thin"

[profile.dist]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
lto = "fat"
codegen-units = 1
