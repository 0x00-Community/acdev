[workspace]
resolver = "3"
# crates/*: the host window. The runtime library is libacde (library name acde), checked out beside this repository (../libacde):
# a path dependency outside the workspace, so a workspace of its own
members = ["crates/*"]
# npm/: the acde CLI (bun), not built as a member
exclude = ["npm", "crates/devd", "crates/agent", "crates/tool"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "http://gitea.dopamine/AC/acdev"
publish = false

[package]
name = "acdev"
version.workspace = true
edition.workspace = true

[dependencies]
libacde = { path = "../libacde" }
acde-scene = { path = "../libacde/scene" }
acde-hostwin = { path = "crates/hostwin" }
# doctor.rs: draws a test frame on the GPU
log = "0"
serde_json = "1"
# hostnative.rs: the dev IPC's shot carries the PNG as base64
base64 = "0"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0"

# wgpu-hal's static DXC on Windows: held at 0.1.4 until the newer ones build in CI, see docs/runtime-build.md「DXC 钉版本」
[target.'cfg(all(windows, not(target_arch = "aarch64"), target_env = "msvc"))'.dependencies]
mach-dxcompiler-rs = { version = "=0.1.4", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.guest]
inherits = "release"
opt-level = 0
debug = "line-tables-only"
strip = false
lto = false
codegen-units = 256
incremental = true

[profile.guest.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = "s"
debug = 0
strip = true
lto = "thin"

[profile.dist]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
lto = "fat"
codegen-units = 1

[patch.crates-io]
wgpu-hal = { path = "../libacde/vendor/wgpu-hal" }
