[workspace]
resolver = "3"
members = ["crates/*"]
# npm/: the acde CLI (bun)
exclude = ["npm"]

[workspace.package]
version = "0.0.9"
edition = "2024"
repository = "http://gitea.dopamine/AC/acdebin-dbg"
publish = false

[package]
name = "acdebin-dbg"
version.workspace = true
edition.workspace = true

[dependencies]
acdert = { path = "../acdert" }
acde-hostwin = { path = "crates/hostwin" }
# doctor.rs: draws a test frame on the GPU
log = "0"
serde_json = "1"
# hostnative.rs: the dev IPC's shot carries the PNG as base64
base64 = "0"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0"

[profile.release]
opt-level = "s"
debug = 0
strip = true
lto = "thin"

[profile.dist]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
lto = "fat"
codegen-units = 1
