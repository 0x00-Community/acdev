name: release

on:
  push:
    tags: ['v*']

jobs:
  dispatch:
    runs-on: debian12
    timeout-minutes: 10
    steps:
      - name: AC/acdebin-dbg's release, publishing this commit as the tag's version
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          tag=${GITHUB_REF#refs/tags/}
          v=${tag#v}
          case $v in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$tag is not v<x.y.z>"; exit 1 ;; esac
          [ -n "$TOKEN" ] || { echo "::error::set the secret RELEASE_TOKEN (write:repository on AC/acdebin-dbg)"; exit 1; }
          api="$GITHUB_SERVER_URL/api/v1/repos/AC/acdebin-dbg"
          dbg=$(curl -fsSL -H "Authorization: token $TOKEN" "$api/branches/main" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).commit.id')
          body=$(node -e 'const [c,a,v]=process.argv.slice(1); process.stdout.write(JSON.stringify({ref: "main", inputs: {publish: "true", commit: c, acdert_commit: a, version: v}}))' "$dbg" "$GITHUB_SHA" "$v")
          curl -fsS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d "$body" "$api/actions/workflows/release.yml/dispatches"
          echo "acdebin-dbg release dispatched: acde $v from acdert $GITHUB_SHA and acdebin-dbg $dbg" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/AC/acdebin-dbg/actions" | tee -a "$GITHUB_STEP_SUMMARY"
