[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/PDBALTPATH:%_PDB%"]

# ac: the AC organisation's cargo registry on gitea.dopamine, where acdert, its crates, the blitz fork and taffy are published
[registries.ac]
index = "sparse+http://gitea.dopamine/api/packages/AC/cargo/"
credential-provider = "cargo:token"
