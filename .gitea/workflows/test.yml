name: test

# Started by hand while the suite settles (see docs/dev/testing.md); it is meant to run on every push to main later.
on:
  workflow_dispatch:
    inputs:
      wpt:
        description: 'gate: the tests the expectations say pass; full: every applicable test but those recorded as timing out; baseline: every applicable test, then the gate twice more, and expectations from the three runs'
        type: choice
        options: [gate, full, baseline]
        default: gate
      dbg:
        description: 'AC/acdebin-dbg commit to build the runtime with; empty takes its main'
        type: string
        default: ''
      workers:
        description: 'parallel WPT sessions per job (most waiting is on timeouts, not CPU)'
        type: string
        default: '20'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

env:
  WPT_STATE: ${{ github.workspace }}/wpt-state
  LABEL: ci-${{ github.run_number }}
  ACDERT: ${{ github.workspace }}/acdebin-dbg/target/release/acdebin-dbg

jobs:
  web:
    runs-on: x86_64-debian-234
    timeout-minutes: 30
    steps:
      - uses: http://gitea.dopamine/mirror/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: http://gitea.dopamine/mirror/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        run: bun install --frozen-lockfile --cwd web
      - name: typecheck
        working-directory: web
        run: bun run typecheck
      - name: unit tests (acde-api, acde-dom, acde-host)
        working-directory: web
        run: bun run test

  # One job per shard: a job stops at the instance's limit (3 h), and every applicable test does not fit in one.
  wpt:
    runs-on: x86_64-debian-234
    timeout-minutes: 175
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: ${{ fromJSON(github.event.inputs.wpt == 'gate' && '[1]' || '[1, 2, 3, 4]') }}
    env:
      SHARDS: ${{ github.event.inputs.wpt == 'gate' && '1' || '4' }}
    steps:
      - uses: http://gitea.dopamine/mirror/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acdert
          persist-credentials: false
      - uses: ./acdert/.gitea/actions/wpt-setup
        with:
          token: ${{ secrets.ACKERNEL_TOKEN || github.token }}
          dbg: ${{ github.event.inputs.dbg }}
          workers: ${{ github.event.inputs.workers }}
      - name: run shard ${{ matrix.shard }}
        shell: bash
        env:
          MODE: ${{ github.event.inputs.wpt }}
          WORKERS: ${{ github.event.inputs.workers }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          w=acdert/scripts/wpt/wpt.sh
          args=(--acdert "$ACDERT" --workers "$WORKERS" --label "$LABEL" --shard "$SHARD/$SHARDS")
          case "$MODE" in
            gate)
              $w expectations gate --platform linux --out "$WPT_STATE/gate.json"
              $w run "${args[@]}" --tests "$WPT_STATE/gate.json" ;;
            full) $w run "${args[@]}" --skip-slow acdert/scripts/wpt/expectations/linux ;;
            baseline) $w run "${args[@]}" ;;
          esac
      - name: check against scripts/wpt/expectations/linux
        if: github.event.inputs.wpt != 'baseline'
        run: acdert/scripts/wpt/wpt.sh expectations check "$LABEL" --platform linux --max 100
      - uses: http://gitea.dopamine/mirror/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7 (official v7.0.2 + isGhes false)
        if: always()
        with:
          name: wpt-shard-${{ matrix.shard }}
          path: ${{ env.WPT_STATE }}/results
          retention-days: 14

  # baseline: the shards' results together, the passing tests twice more, and the expectations from the three runs.
  expectations:
    needs: wpt
    if: always() && github.event.inputs.wpt == 'baseline'
    runs-on: x86_64-debian-234
    timeout-minutes: 175
    steps:
      - uses: http://gitea.dopamine/mirror/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acdert
          persist-credentials: false
      - uses: ./acdert/.gitea/actions/wpt-setup
        with:
          token: ${{ secrets.ACKERNEL_TOKEN || github.token }}
          dbg: ${{ github.event.inputs.dbg }}
          workers: ${{ github.event.inputs.workers }}
      - uses: http://gitea.dopamine/mirror/gitea-download-artifact@3f0bddcec1b25ce059fe5de36de56d8d8519397f # v8 (official v8.0.1 + isGhes false)
        with:
          pattern: wpt-shard-*
          path: shards
      - name: merge the shards, run the gate twice, write expectations/linux
        shell: bash
        env:
          WORKERS: ${{ github.event.inputs.workers }}
        run: |
          set -eu
          w=acdert/scripts/wpt/wpt.sh
          mkdir -p "$WPT_STATE/results/$LABEL"
          cat shards/*/"$LABEL"/results.jsonl > "$WPT_STATE/results/$LABEL/results.jsonl"
          cp "$(ls shards/*/"$LABEL"/meta.json | head -1)" "$WPT_STATE/results/$LABEL/meta.json"
          $w expectations update "$LABEL" --dir "$WPT_STATE/first" > /dev/null
          $w expectations gate --dir "$WPT_STATE/first" --out "$WPT_STATE/gate.json"
          $w run --acdert "$ACDERT" --workers "$WORKERS" --label "$LABEL-b" --tests "$WPT_STATE/gate.json"
          $w run --acdert "$ACDERT" --workers "$WORKERS" --label "$LABEL-c" --tests "$WPT_STATE/gate.json"
          $w expectations update "$LABEL" "$LABEL-b" "$LABEL-c" --dir "$WPT_STATE/expectations/linux"
          $w report "$LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: http://gitea.dopamine/mirror/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7 (official v7.0.2 + isGhes false)
        if: always()
        with:
          name: wpt-expectations
          path: |
            ${{ env.WPT_STATE }}/expectations
            ${{ env.WPT_STATE }}/results/*/report.md
          retention-days: 14

  # full and baseline: acde-demo's apps and its regression cells.
  demo:
    needs: wpt
    if: always() && github.event.inputs.wpt != 'gate'
    runs-on: x86_64-debian-234
    timeout-minutes: 120
    steps:
      - uses: http://gitea.dopamine/mirror/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acdert
          persist-credentials: false
      - uses: ./acdert/.gitea/actions/wpt-setup
        with:
          token: ${{ secrets.ACKERNEL_TOKEN || github.token }}
          dbg: ${{ github.event.inputs.dbg }}
          wpt: 'false'
      - name: acde-demo beside acdert (the only step of the two with the token)
        shell: bash
        env:
          TOKEN: ${{ secrets.ACKERNEL_TOKEN || github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -eu
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraHeader="Authorization: basic ${auth}" clone --quiet --depth 1 "$GITHUB_SERVER_URL/AC/acde-demo.git" acde-demo
          echo "acde-demo $(git -C acde-demo rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: acde-demo's e2e
        working-directory: acde-demo
        env:
          CI: '1'
        run: |
          bun install --frozen-lockfile
          ACDE_APP="$GITHUB_WORKSPACE/acdert/web/packages/acde-host/dist" bun scripts/apps.ts e2e
      - uses: http://gitea.dopamine/mirror/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7 (official v7.0.2 + isGhes false)
        if: always()
        with:
          name: demo-e2e
          path: acde-demo/apps/*/.acde/test-results
          retention-days: 14
