name: package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .gitea/workflows/package.yaml
      - packaging/**
      - crates/**
      - js/**
      - vendors/**
      - Cargo.toml
      - Cargo.lock

jobs:
  package:
    runs-on: archlinux
    steps:
      # first (shell) step, so later JS actions find node in the arch image
      - name: toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust clang cmake pkgconf python nodejs bun unzip curl
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: makepkg
        run: |
          mkdir -p out
          chown -R builder: .
          sudo -u builder git config --global --add safe.directory '*'
          cd packaging/arch
          sudo -u builder env PKGDEST="$GITHUB_WORKSPACE/out" makepkg -s --noconfirm --nocheck
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: upload package
        # actions/upload-artifact v4 and later refuse any server but github.com; this is the same action without that check
        uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7
        with:
          name: acde-base
          path: out/*.pkg.tar.*
          retention-days: 14
          if-no-files-found: error
