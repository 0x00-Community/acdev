name: toolchain
description: a home of this job's own (HOME, CARGO_HOME; the runner runs two jobs at once in one user's home) and the runner's read-only Rust in /opt/rust
inputs:
  targets:
    description: comma-separated targets the job builds for, checked to be installed in /opt/rust
    default: ''
runs:
  using: composite
  steps:
    - name: this job's home, the runner's Rust
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        set -eu
        export RUSTUP_HOME=/opt/rust/rustup
        r=/opt/rust/cargo/bin
        [ -x "$r/rustc" ] || { echo "::error::this runner has no Rust in /opt/rust (acdev's scripts/runner-rust.sh puts it there)"; exit 1; }
        have=$("$r/rustup" target list --installed)
        for t in $(echo "$TARGETS" | tr ',' ' '); do
          echo "$have" | grep -qx "$t" || { echo "::error::/opt/rust has no $t (scripts/runner-rust.sh)"; exit 1; }
        done
        h=$RUNNER_TEMP/home
        mkdir -p "$h"
        printf 'HOME=%s\nCARGO_HOME=%s\nRUSTUP_HOME=%s\nCARGO_INCREMENTAL=0\nCARGO_TERM_COLOR=always\n' "$h" "$h/.cargo" "$RUSTUP_HOME" >> "$GITHUB_ENV"
        echo "$r" >> "$GITHUB_PATH"
        "$r/rustc" -V
