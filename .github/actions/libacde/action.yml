name: libacde
description: libacde (AC/libacde, the runtime library acdev links as ../libacde) checked out beside acdev at libacde/, with its vendor/blitz submodule
inputs:
  token:
    description: a token that reads AC's repositories
    required: true
  ref:
    description: a commit on libacde's main to check out; empty for main's head
    default: ''
runs:
  using: composite
  steps:
    - name: libacde beside acdev, and its vendor/blitz
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        REF: ${{ inputs.ref }}
        GIT_TERMINAL_PROMPT: '0'
      run: |
        set -eu
        auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        g() { git -c http.extraHeader="Authorization: basic ${auth}" "$@"; }
        rm -rf libacde
        g clone --quiet --depth 1 "$GITHUB_SERVER_URL/AC/libacde.git" libacde
        if [ -n "$REF" ] && [ "$(git -C libacde rev-parse HEAD)" != "$REF" ]; then
          g -C libacde fetch --quiet --depth 1 origin "$REF"
          git -C libacde checkout --quiet --detach "$REF"
        fi
        g -C libacde submodule update --init --depth 1
        echo "libacde $(git -C libacde rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
