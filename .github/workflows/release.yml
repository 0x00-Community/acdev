name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version to publish (x.y.z)
        required: true
      publish:
        description: publish to npm
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-apple-darwin, os: macos-15 }
          - { triple: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { triple: x86_64-pc-windows-msvc, os: windows-2025, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          clang pkg-config libssl-dev libdrm-dev libgbm-dev libinput-dev libudev-dev
          libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
      - name: nasm
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/nasm.zip" > /dev/null
          cygpath -w "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      - name: python for stylo
        if: runner.os == 'Windows'
        shell: bash
        run: echo "PYTHON3=$(cygpath -w "$(command -v python)")" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - name: acdert (debug)
        run: cargo build -p acdert --target ${{ matrix.triple }}
      - name: stage
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.triple }}/debug/acdert${{ matrix.exe }} out/acdert-${{ matrix.triple }}${{ matrix.exe }}
      - uses: actions/upload-artifact@v7
        with:
          name: acdert-${{ matrix.triple }}
          path: out

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: host bundle
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - name: stage
        run: |
          mkdir -p out/app
          cp -r web/packages/acde-host/dist web/packages/acde-host/brand web/packages/acde-host/greet web/packages/acde-host/package.json out/app/
          rm -f out/app/dist/*.map
      - uses: actions/upload-artifact@v7
        with:
          name: host
          path: out

  release:
    needs: [build, host]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -C artifacts/host -czf "acdert-host-${TAG#v}.tar.gz" app
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$TAG" \
            --notes "Debug builds. Put the app/ directory from acdert-host-${TAG#v}.tar.gz next to the binary." \
            artifacts/acdert-*/acdert-* "acdert-host-${TAG#v}.tar.gz"

  npm:
    needs: [build, host]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: dopame-org/acde
          token: ${{ secrets.DOPAME_READ_TOKEN }}
          path: acde
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: pack and publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          root=$PWD
          declare -A npm=([aarch64-apple-darwin]=darwin-arm64 [x86_64-unknown-linux-gnu]=linux-x64 [x86_64-pc-windows-msvc]=win32-x64)
          args=()
          for dir in artifacts/acdert-*; do
            triple=${dir#artifacts/acdert-}
            exe=$(ls "$dir")
            args+=(--acdert "${npm[$triple]}=$root/$dir/$exe")
          done
          [ ${#args[@]} -gt 0 ] || { echo "no acdert was built"; exit 1; }
          cd acde && bun install --frozen-lockfile
          if [ "$PUBLISH" = true ]; then publish=(--publish https://registry.npmjs.org/); else publish=(); fi
          bun scripts/pack.ts --version "$VERSION" --host "$root/artifacts/host/app/dist" "${args[@]}" "${publish[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: acde/.npm/*.tgz
