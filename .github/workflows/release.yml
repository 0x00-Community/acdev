name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-apple-darwin, os: macos-15 }
          - { triple: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { triple: x86_64-pc-windows-msvc, os: windows-2025, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          clang pkg-config libssl-dev libdrm-dev libgbm-dev libinput-dev libudev-dev
          libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
      - name: nasm
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/nasm.zip" > /dev/null
          cygpath -w "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      - name: python for stylo
        if: runner.os == 'Windows'
        shell: bash
        run: echo "PYTHON3=$(cygpath -w "$(command -v python)")" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - name: acdert (debug)
        run: cargo build -p acdert --target ${{ matrix.triple }}
      - name: stage
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.triple }}/debug/acdert${{ matrix.exe }} out/acdert-${{ matrix.triple }}${{ matrix.exe }}
      - uses: actions/upload-artifact@v7
        with:
          name: acdert-${{ matrix.triple }}
          path: out
          retention-days: 1

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: host bundle
        working-directory: web
        run: bun install --frozen-lockfile && bun run build
      - name: stage
        run: |
          mkdir -p out/app
          cp -r web/packages/acde-host/dist web/packages/acde-host/brand web/packages/acde-host/greet web/packages/acde-host/package.json out/app/
          rm -f out/app/dist/*.map
      - uses: actions/upload-artifact@v7
        with:
          name: host
          path: out
          retention-days: 1

  release:
    needs: [build, host]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -C artifacts/host -czf "acdert-host-${TAG#v}.tar.gz" app
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$TAG" \
            --notes "Debug builds. Put the app/ directory from acdert-host-${TAG#v}.tar.gz next to the binary." \
            artifacts/acdert-*/acdert-* "acdert-host-${TAG#v}.tar.gz"

  pkgs:
    needs: [build, host]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' && needs.host.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: stage
        run: |
          v=${TAG#v}
          mkdir -p "pkgs/$v"
          cp artifacts/acdert-*/acdert-* "pkgs/$v/"
          tar -C artifacts/host -czf "pkgs/$v/acdert-host-$v.tar.gz" app
          (cd "pkgs/$v" && sha256sum -- * > SHA256SUMS)
          files=$(cd "pkgs/$v" && ls | jq -R . | jq -sc .)
          jq -n --arg version "$v" --arg tag "$TAG" --arg commit "$GITHUB_SHA" --argjson files "$files" \
            '{version: $version, tag: $tag, commit: $commit, base: "https://pkgs.dopame.ai/acdert/\($version)/", files: $files}' \
            > pkgs/latest.json
          cat pkgs/latest.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::312030312811:role/dopame-acdert-release
          aws-region: ap-southeast-1
      - name: upload
        run: |
          v=${TAG#v}
          aws s3 cp "pkgs/$v" "s3://dopame-pkgs/acdert/$v/" --recursive \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp pkgs/latest.json s3://dopame-pkgs/acdert/latest.json \
            --content-type application/json --cache-control 'public, max-age=0, must-revalidate'
      - name: invalidate
        run: aws cloudfront create-invalidation --distribution-id E3ET3L14ALFOXX --paths "/acdert/latest.json" "/acdert/${TAG#v}/*" --query Invalidation.Id --output text
      - run: echo "https://pkgs.dopame.ai/acdert/${TAG#v}/" >> "$GITHUB_STEP_SUMMARY"

  npm-build:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: check version
        id: version
        working-directory: web/packages/acde-api
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$TAG" ] || { echo "::error::$name is $version but the tag is $TAG"; exit 1; }
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.publish == 'true'
      - name: build
        if: steps.version.outputs.publish == 'true'
        run: |
          bun install --frozen-lockfile --cwd web
          bun run --cwd web/packages/acde-api build
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.publish == 'true'
        with:
          name: acde-api
          path: web/packages/acde-api/dist
          retention-days: 1

  npm:
    needs: npm-build
    if: ${{ needs.npm-build.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: acde-api
          path: dist
      - name: publish
        working-directory: dist
        run: |
          npm_version=$(npm --version)
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$npm_version" \
            || { echo "::error::trusted publishing needs npm 11.5.1 or later, the runner has $npm_version"; exit 1; }
          npm publish --ignore-scripts
