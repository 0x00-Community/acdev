name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'x.y.z to build and check; a hand run is a preview and uploads nothing'
        required: true
        type: string

permissions:
  contents: read

env:
  PKGS: https://pkgs.dopame.ai
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  AWS_REGION: ap-southeast-1
  ROLE: arn:aws:iam::312030312811:role/dopame-acde-release
  BUCKET: dopame-pkgs
  PREFIX: acde
  CLOUDFRONT_DISTRIBUTION: E3ET3L14ALFOXX

jobs:
  pkgs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acde
          persist-credentials: false
      - name: the tag is this version
        working-directory: acde
        run: |
          v=$(node -p 'require("./package.json").version')
          if [ "v$v" != "$TAG" ]; then
            echo "::error::acde is $v but the tag is $TAG"
            exit 1
          fi
          echo "SDK_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: the SDK tarball from pkgs.dopame.ai, checked against its SHA256SUMS
        run: |
          set -eu
          base="$PKGS/acdert/$SDK_VERSION"
          name="acde-api-$SDK_VERSION.tar.gz"
          mkdir -p in/sdk
          curl -fsSL "$base/SHA256SUMS" -o in/sdk/SHA256SUMS || {
            echo "::error::no $base/SHA256SUMS: acdert $SDK_VERSION must be published on pkgs first"
            exit 1
          }
          curl -fsSL "$base/$name" -o "in/sdk/$name" || {
            echo "::error::cannot download $base/$name"
            exit 1
          }
          expected=$(awk -v f="$name" '$2 == f || $2 == "*" f { print $1 }' in/sdk/SHA256SUMS)
          if [ -z "$expected" ]; then
            echo "::error::$name is not listed in SHA256SUMS"
            exit 1
          fi
          actual=$(sha256sum "in/sdk/$name" | cut -d ' ' -f 1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::$name does not match its SHA256SUMS"
            exit 1
          fi
          mkdir -p in/sdk/unpacked
          tar -xzf "in/sdk/$name" -C in/sdk/unpacked
          if [ "$(ls in/sdk/unpacked)" != package ]; then
            echo "::error::$name must unpack to package/ (the npm layout), found: $(ls in/sdk/unpacked)"
            exit 1
          fi
          test -f in/sdk/unpacked/package/package.json
          test -f in/sdk/unpacked/package/src/index.js
          test -f in/sdk/unpacked/package/src/validate.js
          mkdir -p "$GITHUB_WORKSPACE/acdert/web/packages"
          rm -rf "$GITHUB_WORKSPACE/acdert/web/packages/acde-api"
          mv in/sdk/unpacked/package "$GITHUB_WORKSPACE/acdert/web/packages/acde-api"
      - name: the placed SDK is the pinned one, at the path package.json names
        working-directory: acde
        run: |
          node -e '
            const fs = require("fs")
            const self = JSON.parse(fs.readFileSync("package.json", "utf8"))
            const spec = self.dependencies["@dopame/acde-api"]
            const placed = JSON.parse(fs.readFileSync(process.argv[1] + "/package.json", "utf8"))
            if (spec !== "file:../acdert/web/packages/acde-api") throw new Error("unexpected spec " + spec)
            if (placed.name !== "@dopame/acde-api" || placed.version !== process.argv[2]) {
              throw new Error("placed " + placed.name + "@" + placed.version + ", want " + process.argv[2])
            }
          ' "$GITHUB_WORKSPACE/acdert/web/packages/acde-api" "$SDK_VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        working-directory: acde
        run: bun install --frozen-lockfile
      - name: dist
        working-directory: acde
        run: |
          v=${TAG#v}
          bun scripts/dist.ts --api "$GITHUB_WORKSPACE/acdert/web/packages/acde-api" --sdk "$SDK_VERSION" \
            --version "$v" --out "$GITHUB_WORKSPACE/out"
      - name: latest.json
        run: |
          v=${TAG#v}
          files=$(cd "$GITHUB_WORKSPACE/out/$v" && ls | jq -R . | jq -sc .)
          jq -n --arg version "$v" --arg tag "$TAG" --arg commit "$GITHUB_SHA" --arg sdk "$SDK_VERSION" \
            --argjson files "$files" \
            '{version: $version, tag: $tag, commit: $commit, sdk: $sdk, base: "https://pkgs.dopame.ai/acde/\($version)/", files: $files}' \
            > "$GITHUB_WORKSPACE/out/latest.json"
          cat "$GITHUB_WORKSPACE/out/latest.json"
      - name: the archive starts the CLI
        run: |
          set -eu
          v=${TAG#v}
          mkdir -p smoke
          tar -xzf "$GITHUB_WORKSPACE/out/$v/acde-$v.tar.gz" -C smoke
          if "smoke/acde-$v/bin/acde" 2>&1 | grep -q 'usage: acde <command>'; then
            echo "shim ok"
          else
            echo "::error::bin/acde does not start the CLI"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acde-release
          path: out
          if-no-files-found: error
          retention-days: 1

  guard:
    needs: pkgs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acde
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: acde-release
          path: out
      - name: the release is exactly the allow-list and the shipped content is clean
        working-directory: acde
        run: |
          set -eu
          v=$(cat "$GITHUB_WORKSPACE/out/latest")
          if [ "v$v" != "$TAG" ]; then
            echo "::error::the release is $v but the tag is $TAG"
            exit 1
          fi
          bun scripts/release-guard.ts --dir "$GITHUB_WORKSPACE/out" --version "$v"
      - name: a hand run stops here
        if: github.event_name != 'push'
        run: |
          echo "preview only: the archive passed the guard and nothing was uploaded" >> "$GITHUB_STEP_SUMMARY"

  upload:
    needs: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: acde-release
          path: out
      - name: check the allow-list and the checksums once more
        run: |
          set -eu
          v=$(cat out/latest)
          case $v in *[!0-9A-Za-z.-]*|'') echo "::error::bad version"; exit 1 ;; esac
          if [ "v$v" != "$TAG" ]; then
            echo "::error::the release is $v but the tag is $TAG"
            exit 1
          fi
          expected=$(mktemp)
          {
            echo install.ps1
            echo install.sh
            echo latest
            echo latest.json
            echo "$v/SHA256SUMS"
            echo "$v/acde-$v.tar.gz"
          } | sort > "$expected"
          (cd out && find . -type f | sed 's|^\./||' | sort) > actual
          if ! diff "$expected" actual; then
            echo "::error::the release is not exactly the allow-list"
            exit 1
          fi
          (cd "out/$v" && sha256sum -c SHA256SUMS)
      - name: credentials from the GitHub OIDC token
        run: |
          set -eu
          token=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$token"
          creds=$(aws sts assume-role-with-web-identity --role-arn "$ROLE" \
            --role-session-name "acde-$GITHUB_RUN_ID" --web-identity-token "$token" \
            --duration-seconds 3600 --query Credentials --output json)
          key=$(jq -r .AccessKeyId <<< "$creds")
          secret=$(jq -r .SecretAccessKey <<< "$creds")
          session=$(jq -r .SessionToken <<< "$creds")
          echo "::add-mask::$key"
          echo "::add-mask::$secret"
          echo "::add-mask::$session"
          {
            echo "AWS_ACCESS_KEY_ID=$key"
            echo "AWS_SECRET_ACCESS_KEY=$secret"
            echo "AWS_SESSION_TOKEN=$session"
          } >> "$GITHUB_ENV"
      - name: refuse to overwrite a published version
        run: |
          set -eu
          v=$(cat out/latest)
          for key in "$PREFIX/$v/acde-$v.tar.gz" "$PREFIX/$v/SHA256SUMS"; do
            if output=$(aws s3api head-object --bucket "$BUCKET" --key "$key" 2>&1); then
              echo "::error::$key is already published: a version is never overwritten"
              exit 1
            fi
            case $output in
              *Not\ Found*|*NotFound*|*404*) ;;
              *) echo "::error::cannot check $key: $output"; exit 1 ;;
            esac
          done
      - name: upload the allow-list, one file at a time
        run: |
          set -eu
          v=$(cat out/latest)
          immutable='public, max-age=31536000, immutable'
          fresh='public, max-age=0, must-revalidate'
          text='text/plain; charset=utf-8'
          put() { aws s3 cp "$1" "s3://$BUCKET/$PREFIX/$2" --only-show-errors --content-type "$3" --cache-control "$4"; }
          put "out/$v/acde-$v.tar.gz" "$v/acde-$v.tar.gz" application/gzip "$immutable"
          put "out/$v/SHA256SUMS" "$v/SHA256SUMS" "$text" "$immutable"
          put out/latest latest "$text" "$fresh"
          put out/latest.json latest.json application/json "$fresh"
          put out/install.sh install.sh "$text" "$fresh"
          put out/install.ps1 install.ps1 "$text" "$fresh"
      - name: invalidate
        run: |
          set -eu
          v=$(cat out/latest)
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION" \
            --paths /acde/latest /acde/latest.json /acde/install.sh /acde/install.ps1 \
            "/acde/$v/SHA256SUMS" "/acde/$v/acde-$v.tar.gz" --query Invalidation.Id --output text
      - run: |
          {
            echo "curl -fsSL https://pkgs.dopame.ai/acde/install.sh | sh"
            echo
            echo "irm https://pkgs.dopame.ai/acde/install.ps1 | iex"
          } >> "$GITHUB_STEP_SUMMARY"
