name: release

# Runs on the internal Gitea (AC/acdert -> Actions -> release -> Run workflow), which reads .github/workflows, and on GitHub.
# The publish switch is read once, in plan, by the shell: this Gitea gives inputs.publish as false even when publish is
# ticked and github.event.inputs.publish as a boolean, where GitHub gives the string 'true'; as text in an environment
# variable both are true. Later jobs read needs.plan.outputs. Artifacts go through christopherhx/gitea-upload-artifact and
# gitea-download-artifact (pinned; the official v4+ actions refuse every server but github.com). Tags are pushed with git.
# The version directory and latest.json go to the S3 bucket dopame-pkgs (pkgs.dopame.ai, CloudFront E3ET3L14ALFOXX) on both
# servers, through scripts/release/s3.sh, as the role dopame-acdert-release: GitHub assumes it with OIDC, Gitea with the key of
# the IAM user gitea-acdert-release (secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY). The GitHub release runs only on github.com;
# on Gitea, tag-gitea and latest-gitea take the place of tag and latest.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'false rehearses (builds and checks only); true publishes a new release from main'
        type: boolean
        default: false
      commit:
        description: 'full or short sha on origin/main to publish or rehearse; a formal release needs it, a rehearsal defaults to the run commit'
        type: string
        default: ''
      skip_targets:
        description: 'targets not to build or ship this time, comma-separated without spaces (e.g. aarch64-apple-darwin); empty builds all four'
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  S3_BUCKET: dopame-pkgs
  CF_DISTRIBUTION: E3ET3L14ALFOXX
  AWS_ROLE: arn:aws:iam::312030312811:role/dopame-acdert-release
  PKGS_URL: https://pkgs.dopame.ai

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-prepare-${{ github.ref }}-plan
      cancel-in-progress: false
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      github: ${{ steps.plan.outputs.github }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: version, tag and mode (preview, new, resume)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PUBLISH_INPUT: ${{ github.event.inputs.publish }}
          COMMIT: ${{ github.event.inputs.commit }}
          SERVER: ${{ github.server_url }}
          SKIP: ${{ github.event.inputs.skip_targets }}
        run: |
          . scripts/release/targets.sh
          case "${SKIP:-}" in *[[:space:]]*) echo "::error::skip_targets takes triples separated by commas, without spaces: '$SKIP'"; exit 1 ;; esac
          targets=$(targets_without "${SKIP:-}")
          targets=${targets// /,}
          echo "targets=$targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          if [ "${PUBLISH_INPUT:-}" = true ]; then publish=true; else publish=false; fi
          if [ "$SERVER" = https://github.com ]; then github=true; else github=false; fi
          echo "publish=$publish github=$github"
          { echo "publish=$publish"; echo "github=$github"; } >> "$GITHUB_OUTPUT"
          scripts/release/plan.sh "$EVENT" "$REF_TYPE" "$REF_NAME" "$SHA" "$publish" "${COMMIT:-}"

  build:
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    concurrency:
      group: release-prepare-${{ github.ref }}-build-${{ matrix.triple }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-apple-darwin, os: macos-15 }
          - { triple: x86_64-apple-darwin, os: macos-15-intel }
          - { triple: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { triple: x86_64-pc-windows-msvc, os: windows-2025, exe: .exe }
    runs-on: ${{ contains(format(',{0},', github.event.inputs.skip_targets), format(',{0},', matrix.triple)) && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 120
    env:
      BUILD: ${{ contains(format(',{0},', needs.plan.outputs.targets), format(',{0},', matrix.triple)) }}
    steps:
      - name: skipped target
        if: env.BUILD != 'true'
        run: echo "${{ matrix.triple }} is in skip_targets; nothing to build"
      - uses: actions/checkout@v7
        timeout-minutes: 10
        if: env.BUILD == 'true'
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: system libraries
        if: env.BUILD == 'true' && runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          clang pkg-config libssl-dev libdrm-dev libgbm-dev libinput-dev libudev-dev
          libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
          libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: nasm
        if: env.BUILD == 'true' && runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/nasm.zip" > /dev/null
          cygpath -w "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      - name: python for stylo
        if: env.BUILD == 'true' && runner.os == 'Windows'
        shell: bash
        run: echo "PYTHON3=$(cygpath -w "$(command -v python)")" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: env.BUILD == 'true'
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        if: env.BUILD == 'true'
        with:
          key: dist-${{ matrix.triple }}
      - name: rustc flags (static CRT on Windows, paths remapped, PDB by file name)
        if: env.BUILD == 'true'
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          sysroot=$(rustc --print sysroot)
          workspace="$GITHUB_WORKSPACE"
          flags=""
          case "$(uname -s)" in
            MINGW* | MSYS* | CYGWIN*)
              cargo_home=$(cygpath -w "$cargo_home")
              sysroot=$(cygpath -w "$sysroot")
              workspace=$(cygpath -w "$workspace")
              flags="-C target-feature=+crt-static -C link-arg=/PDBALTPATH:%_PDB%"
              ;;
          esac
          flags="$flags --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$sysroot=/rustc --remap-path-prefix=$workspace=/src"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
      - name: "acdert (dist profile: release build, split debug information)"
        if: env.BUILD == 'true'
        run: cargo build --profile dist -p acdert --target ${{ matrix.triple }}
      - name: stage binary and split debug information
        if: env.BUILD == 'true'
        shell: bash
        run: |
          dist=target/${{ matrix.triple }}/dist
          mkdir -p out symbols
          cp "$dist/acdert${{ matrix.exe }}" "out/acdert-${{ matrix.triple }}${{ matrix.exe }}"
          for part in acdert.pdb acdert.dwp acdert.dSYM; do
            if [ -e "$dist/$part" ]; then cp -RL "$dist/$part" symbols/; fi
          done
          if [ -z "$(ls -A symbols)" ]; then echo "::error::no split debug information was produced"; exit 1; fi
          ls -la out symbols
      - uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7
        if: env.BUILD == 'true'
        with:
          name: acdert-${{ matrix.triple }}
          path: out
          retention-days: 1
      - uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7
        if: env.BUILD == 'true'
        with:
          name: symbols-${{ matrix.triple }}
          path: symbols
          retention-days: 30
          if-no-files-found: error

  host:
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    concurrency:
      group: release-prepare-${{ github.ref }}-host
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
      - name: "host bundle (release build: minified, obfuscated, no source maps)"
        working-directory: web
        run: bun install --frozen-lockfile && bun run --filter @dopame/acde-host build:release
      - name: stage
        run: |
          mkdir -p out/app
          cp -r web/packages/acde-host/dist-release out/app/dist
          cp -r web/packages/acde-host/brand web/packages/acde-host/greet web/packages/acde-host/package.json out/app/
          cp LICENSE out/LICENSE
      - name: leak check
        run: |
          bun web/packages/acde-host/scripts/check-release.mjs out/app/dist
          leaks=$(find out -name '*.map' -o -name '*.ts' -o -name '*.tsx' -o -name '*.ts.map')
          if [ -n "$leaks" ]; then echo "::error::source-like files in the host artifact:"; echo "$leaks"; exit 1; fi
      - uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7
        with:
          name: host
          path: out
          retention-days: 1

  stage:
    needs: [plan, build, host]
    if: ${{ needs.plan.result == 'success' && needs.build.result == 'success' && needs.host.result == 'success' }}
    concurrency:
      group: release-prepare-${{ github.ref }}-stage
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TARGETS: ${{ needs.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: christopherhx/gitea-download-artifact@89488ecb8305ea3f5c6b0e4b000a2d28388fbda5 # v7
        with:
          path: artifacts
      - uses: oven-sh/setup-bun@v2
      - name: web workspace (builds the acde-api SDK for its archive)
        run: bun install --frozen-lockfile --cwd web
      - name: stage the release files (explicit allow-list; symbol artifacts are never read)
        run: scripts/release/stage.sh artifacts "$VERSION" out
      - uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7
        with:
          name: release-stage
          path: out
          retention-days: 1

  tag:
    needs: [plan, pkgs, upload]
    if: ${{ needs.plan.outputs.github == 'true' && needs.plan.outputs.mode == 'new' && needs.pkgs.result == 'success' && needs.upload.result == 'success' }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: annotated tag on the commit that passed the checks
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" -m "acdert $TAG" "$SHA"
          git push origin "refs/tags/$TAG"


  tag-gitea:
    needs: [plan, upload]
    if: ${{ needs.plan.outputs.github != 'true' && (needs.plan.outputs.mode == 'new' || needs.plan.outputs.mode == 'resume') && needs.upload.result == 'success' }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: annotated tag on the commit that passed the checks (a resumed run has it already)
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          if [ "$MODE" = resume ]; then echo "$TAG is already on $SHA"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" -m "acdert $TAG" "$SHA"
          git push origin "refs/tags/$TAG"

  release:
    needs: [plan, upload, tag]
    if: ${{ !cancelled() && needs.plan.outputs.github == 'true' && needs.plan.result == 'success' && needs.upload.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') && (needs.plan.outputs.mode == 'new' || needs.plan.outputs.mode == 'resume') }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TARGETS: ${{ needs.plan.outputs.targets }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: christopherhx/gitea-download-artifact@89488ecb8305ea3f5c6b0e4b000a2d28388fbda5 # v7
        with:
          name: release-stage
          path: release-stage
      - name: check the staging before upload
        run: scripts/release/check-stage.sh release-stage "$VERSION"
      - name: GitHub release (created once, a re-run replaces the assets)
        run: |
          . scripts/release/targets.sh
          files=()
          for triple in $(release_targets); do files+=("$(target_archive "$triple")"); done
          files+=("acdert-host-$VERSION.tar.gz" LICENSE)
          level=$(sed -n 's/^export const API_LEVEL = \([0-9][0-9]*\).*/\1/p' web/packages/acde-api/src/runtime/level.js)
          test -n "$level"
          notes="Contract level $level: packages need \"apiLevel\": $level (packages without it, or built for another level, are refused; rebuild them with the current acde).
          The runtime is not yet a security boundary: until the third-party sandbox ships, local and developer builds run as the developer's own code.
          Release builds (split debug information is not attached). Each acdert-<target>.tar.xz (Windows: .tar.gz) holds only the acdert binary; put the app/ directory from acdert-host-$VERSION.tar.gz next to it."
          cd release-stage
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$TAG" --notes "$notes" \
              "${files[@]}"
          fi

  pkgs:
    needs: [plan, stage]
    if: ${{ needs.plan.result == 'success' && needs.stage.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TARGETS: ${{ needs.plan.outputs.targets }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: christopherhx/gitea-download-artifact@89488ecb8305ea3f5c6b0e4b000a2d28388fbda5 # v7
        with:
          name: release-stage
          path: release-stage
      - name: check the staging and build the pkgs directory
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          command -v jq > /dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends jq; }
          scripts/release/check-stage.sh release-stage "$VERSION"
          mkdir -p "pkgs/$VERSION"
          . scripts/release/targets.sh
          for triple in $(release_targets); do cp "release-stage/$(target_archive "$triple")" "pkgs/$VERSION/"; done
          cp "release-stage/acdert-host-$VERSION.tar.gz" release-stage/LICENSE "release-stage/acde-api-$VERSION.tar.gz" "pkgs/$VERSION/"
          (cd "pkgs/$VERSION" && sha256sum -- * > SHA256SUMS)
          scripts/release/check-stage.sh "pkgs/$VERSION" "$VERSION"
          files=$(cd "pkgs/$VERSION" && ls | jq -R . | jq -sc .)
          jq -n --arg version "$VERSION" --arg tag "$TAG" --arg commit "$SHA" --arg pkgs "$PKGS_URL" --argjson files "$files" \
            '{version: $version, tag: $tag, commit: $commit, base: "\($pkgs)/acdert/\($version)/", files: $files}' \
            > pkgs/latest.json
          cat pkgs/latest.json
      - uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7
        with:
          name: pkgs
          path: pkgs
          retention-days: 30

  upload:
    needs: [plan, pkgs]
    if: ${{ needs.plan.result == 'success' && needs.pkgs.result == 'success' && (needs.plan.outputs.mode == 'new' || needs.plan.outputs.mode == 'resume') }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TARGETS: ${{ needs.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: christopherhx/gitea-download-artifact@89488ecb8305ea3f5c6b0e4b000a2d28388fbda5 # v7
        with:
          name: pkgs
          path: pkgs
      - name: check the version directory before upload
        run: scripts/release/check-stage.sh "pkgs/$VERSION" "$VERSION"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ env.AWS_ROLE }}
          role-skip-session-tagging: true
          aws-region: ap-southeast-1
      - name: upload the version directory to S3 (same content is skipped, different content is refused)
        run: scripts/release/s3.sh put "pkgs/$VERSION" "acdert/$VERSION"
      - name: verify every object of the version directory before the tag
        run: scripts/release/s3.sh verify "pkgs/$VERSION" "acdert/$VERSION"

  latest:
    needs: [plan, upload, release]
    if: ${{ !cancelled() && needs.plan.outputs.github == 'true' && needs.plan.result == 'success' && needs.upload.result == 'success' && needs.release.result == 'success' }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: christopherhx/gitea-download-artifact@89488ecb8305ea3f5c6b0e4b000a2d28388fbda5 # v7
        with:
          name: pkgs
          path: pkgs
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ env.AWS_ROLE }}
          role-skip-session-tagging: true
          aws-region: ap-southeast-1
      - name: 'latest.json (last: the version directory is verified and the GitHub release exists)'
        run: scripts/release/s3.sh latest pkgs/latest.json acdert/latest.json "acdert/$VERSION"
      - run: echo "$PKGS_URL/acdert/$VERSION/" >> "$GITHUB_STEP_SUMMARY"

  latest-gitea:
    needs: [plan, upload, tag-gitea]
    if: ${{ needs.plan.outputs.github != 'true' && needs.plan.result == 'success' && needs.upload.result == 'success' && needs['tag-gitea'].result == 'success' }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: christopherhx/gitea-download-artifact@89488ecb8305ea3f5c6b0e4b000a2d28388fbda5 # v7
        with:
          name: pkgs
          path: pkgs
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ env.AWS_ROLE }}
          role-skip-session-tagging: true
          aws-region: ap-southeast-1
      - name: 'latest.json (last: the version directory is verified and tagged)'
        run: scripts/release/s3.sh latest pkgs/latest.json acdert/latest.json "acdert/$VERSION"
      - run: echo "$PKGS_URL/acdert/$VERSION/" >> "$GITHUB_STEP_SUMMARY"
