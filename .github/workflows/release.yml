name: release

# Run by hand on Gitea (AC/acdebin-dbg → Actions → release → Run workflow): build, check and preview.
# Publish: the same with publish ticked and commit=<sha>, or push a tag v<x.y.z>. The version counts up by itself: one patch
# past the highest of pkgs' latest.json, npm (@dopame/acde, @dopame/acde-api) and the v* tags (a pushed tag gives its own);
# scripts/set-version.sh writes it into Cargo.toml and package.json in each job, uncommitted. One release, one version: the
# acdebin-dbg builds, the host files (acde-host), the SDK, the acde CLI (npm/) and the installers, all in
# pkgs.dopame.ai/acde/<version>/ under one SHA256SUMS, and on npm (job npm, secret NPM_TOKEN). acdert (the library, AC/acdert) is checked out beside this
# checkout at acdert_commit, with its vendor/blitz submodule; its cargo registry ac needs ACKERNEL_TOKEN.
# The order of a publish: versioned files uploaded and read back, then the annotated tag, then latest.json last.
# Linux jobs run in node:22-bookworm (Debian 12, Node 22): what it lacks (jq, awscli) comes from Debian's apt.
# Gitea reads .github/workflows; the same file also runs on GitHub.
# Every target builds on the debian12 runners: Linux natively, Windows with cargo-xwin (OpenSSL built beside it with clang),
# macOS with cargo-zigbuild and the MacOSX15.5 SDK; no macOS or Windows machine is needed.
# Commits, versions and tags are answered by git, not by a forge API. The publish switch is read once, in plan, by
# the shell: Gitea gives inputs.publish as false even when ticked and github.event.inputs.publish as a boolean where
# GitHub gives the string 'true'; in an environment variable both are the text true. Artifacts go through the
# christopherhx/gitea-*-artifact forks: the official actions/*-artifact v4+ refuse any server but github.com.
on:
  # pushing the tag v<version> (on a commit of main whose npm/package.json and Cargo.toml say <version>) publishes it
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'false: build and check only. true: tag v<version> and publish (main only, commit required)'
        required: false
        default: false
        type: boolean
      commit:
        description: 'full or short SHA of a commit on origin/main (required for publish=true)'
        required: false
        default: ''
        type: string
      acdert_commit:
        description: 'full or short sha of AC/acdert to build with; empty takes its main. Its SDK version must equal this release'
        required: false
        default: ''
        type: string
      skip_targets:
        description: 'targets not to build or ship this time, comma-separated without spaces (e.g. aarch64-apple-darwin)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: acde-release
  cancel-in-progress: false

env:
  PKGS: https://pkgs.dopame.ai
  AWS_REGION: ap-southeast-1
  ROLE: arn:aws:iam::312030312811:role/dopame-acde-release
  BUCKET: dopame-pkgs
  PREFIX: acde
  CLOUDFRONT_DISTRIBUTION: E3ET3L14ALFOXX

jobs:
  plan:
    runs-on: debian12
    container: node:22-bookworm
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      acdert_sha: ${{ steps.acdert.outputs.sha }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acdebin-dbg
          fetch-depth: 0
          persist-credentials: false
      - name: the commit is a full SHA on origin/main, and package.json gives the version
        id: version
        working-directory: acdebin-dbg/npm
        env:
          PUBLISH_INPUT: ${{ github.event.inputs.publish }}
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -eu
          if [ "${PUBLISH_INPUT:-}" = true ]; then PUBLISH=true; else PUBLISH=false; fi
          PUSHED_TAG=
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/v*) PUBLISH=true; COMMIT=$GITHUB_SHA; PUSHED_TAG=${GITHUB_REF#refs/tags/} ;;
          esac
          if [ -z "$COMMIT" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::a publish needs a commit: run it with -f commit=<sha>"
              exit 1
            fi
            sha=$GITHUB_SHA
          else
            sha=$(git rev-parse --verify --quiet "$COMMIT^{commit}") || {
              echo "::error::$COMMIT is not a commit in this repository"
              exit 1
            }
          fi
          if [ "$PUBLISH" = true ] || [ -n "$COMMIT" ]; then
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::$sha is neither origin/main nor one of its ancestors"
              exit 1
            fi
          fi
          if [ "$PUBLISH" = true ] && [ -z "$PUSHED_TAG" ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a release is published from main only; this run is on $GITHUB_REF"
            exit 1
          fi
          git checkout --quiet --detach "$sha"
          if [ -n "$PUSHED_TAG" ]; then
            v=${PUSHED_TAG#v}
          else
            # the next patch after the highest version released anywhere: pkgs' latest.json, npm, and the v* tags
            seen=$( {
              curl -fsSL "$PKGS/$PREFIX/latest.json" 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' 2>/dev/null || true
              for pkg in @dopame/acde @dopame/acde-api; do npm view "$pkg" versions --json 2>/dev/null | node -p 'const v=JSON.parse(require("fs").readFileSync(0,"utf8"));(Array.isArray(v)?v:[v]).join("\n")' 2>/dev/null || true; done
              git tag --list 'v*' | sed 's/^v//'
            } | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            seen=${seen:-0.0.0}
            v=$(echo "$seen" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
            echo "highest released: $seen; this release: $v"
          fi
          case $v in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version $v is not x.y.z"; exit 1 ;;
          esac
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "commit $sha, acde $v, publish=$PUBLISH"
      - name: the targets to build
        id: targets
        env:
          SKIP: ${{ github.event.inputs.skip_targets }}
        run: |
          set -eu
          all="x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc"
          case "${SKIP:-}" in *[[:space:]]*) echo "::error::skip_targets takes triples separated by commas, without spaces"; exit 1 ;; esac
          for s in $(echo "${SKIP:-}" | tr , ' '); do
            case " $all " in *" $s "*) ;; *) echo "::error::unknown target to skip: $s (one of $all)"; exit 1 ;; esac
          done
          left=
          for t in $all; do case ",${SKIP:-}," in *",$t,"*) ;; *) left="$left,$t" ;; esac; done
          left=${left#,}
          [ -n "$left" ] || { echo "::error::skip_targets leaves no target to build"; exit 1; }
          echo "targets=$left" | tee -a "$GITHUB_OUTPUT"
      - name: the acdert commit to build with
        id: acdert
        env:
          TOKEN: ${{ secrets.ACKERNEL_TOKEN || github.token }}
          ACDERT_COMMIT: ${{ github.event.inputs.acdert_commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          lib="$RUNNER_TEMP/acdert"
          git -c http.extraHeader="Authorization: basic ${auth}" clone --filter=blob:none --no-checkout "$GITHUB_SERVER_URL/AC/acdert.git" "$lib"
          sha=$(git -C "$lib" rev-parse --verify "${ACDERT_COMMIT:-origin/main}^{commit}")
          git -C "$lib" merge-base --is-ancestor "$sha" origin/main || { echo "::error::acdert $sha is not on its main"; exit 1; }
          echo "acdert $sha, built as $VERSION"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: the tag is free, or already points at this commit
        if: steps.version.outputs.publish == 'true'
        working-directory: acdebin-dbg/npm
        env:
          SHA: ${{ steps.version.outputs.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          if tagged=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            if [ "$tagged" != "$SHA" ]; then
              echo "::error::$TAG already exists and points at $tagged, not at $SHA"
              exit 1
            fi
            echo "$TAG already points at $SHA: a rerun continues"
          else
            echo "$TAG is free"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-apple-darwin, cross: zigbuild }
          - { triple: x86_64-apple-darwin, cross: zigbuild }
          - { triple: x86_64-unknown-linux-gnu, cross: '' }
          - { triple: x86_64-pc-windows-msvc, cross: xwin, exe: .exe }
    runs-on: debian12
    timeout-minutes: 120
    env:
      BUILD: ${{ contains(format(',{0},', needs.plan.outputs.targets), format(',{0},', matrix.triple)) }}
    steps:
      - name: skipped target
        if: env.BUILD != 'true'
        run: echo "${{ matrix.triple }} is in skip_targets; nothing to build"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.BUILD == 'true'
        with:
          path: acdebin-dbg
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: acdert beside it, and its vendor/blitz (public on GitHub, fetched without the Gitea token)
        if: env.BUILD == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.ACKERNEL_TOKEN || github.token }}
          ACDERT_SHA: ${{ needs.plan.outputs.acdert_sha }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraHeader="Authorization: basic ${auth}" clone --filter=blob:none --no-checkout "$GITHUB_SERVER_URL/AC/acdert.git" acdert
          git -c http.extraHeader="Authorization: basic ${auth}" -C acdert checkout --detach "$ACDERT_SHA"
          git -C acdert submodule update --init --depth 1
      - name: system libraries (Linux), clang and LLVM's linker and archiver (cross)
        if: env.BUILD == 'true'
        run: |
          s=$(command -v sudo || true); $s apt-get update
          if [ -z "${{ matrix.cross }}" ]; then
            $s apt-get install -y --no-install-recommends clang pkg-config libssl-dev libdrm-dev libgbm-dev libinput-dev libudev-dev \
              libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libxkbcommon-dev libfontconfig-dev \
              libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xz-utils
          else
            $s apt-get install -y --no-install-recommends clang lld llvm python3 perl make xz-utils
          fi
      - name: cargo-xwin (Windows from Linux; the MSVC CRT and SDK with ATL)
        if: env.BUILD == 'true' && matrix.cross == 'xwin'
        shell: bash
        run: |
          set -eu
          f=cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/$f"
          echo "c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "XWIN_INCLUDE_ATL=true" >> "$GITHUB_ENV"
      - name: cargo-zigbuild, zig and the macOS SDK (macOS from Linux)
        if: env.BUILD == 'true' && matrix.cross == 'zigbuild'
        shell: bash
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          f=cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz
          curl -sSfL -o "$f" "https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.24.1/$f"
          echo "f09b180a517af0e4dd4bffc921bb88e5ab705452a9dd948c61e489b3020c68c2  $f" | sha256sum -c -
          mkdir -p zb bin && tar -xJf "$f" -C zb && find zb -name cargo-zigbuild -type f -exec cp {} bin/ \;
          z=zig-x86_64-linux-0.17.1.tar.xz
          curl -sSfL -o "$z" "https://ziglang.org/download/0.17.1/$z"
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $z" | sha256sum -c -
          tar -xJf "$z" && ln -sf "$RUNNER_TEMP/zig-x86_64-linux-0.17.1/zig" bin/zig
          sdk=MacOSX15.5.sdk.tar.xz
          curl -sSfL -o "$sdk" "https://github.com/joseluisq/macosx-sdks/releases/download/15.5/$sdk"
          echo "c15cf0f3f17d714d1aa5a642da8e118db53d79429eb015771ba816aa7c6c1cbd  $sdk" | sha256sum -c -
          mkdir -p sdk && tar -xJf "$sdk" -C sdk
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$RUNNER_TEMP/sdk/MacOSX15.5.sdk" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # v1 (its stable branch)
        if: env.BUILD == 'true'
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: env.BUILD == 'true'
        with:
          key: dist-${{ matrix.triple }}
          workspaces: acdebin-dbg -> target
      - name: OpenSSL for Windows (openssl-src's own build wants Windows perl and nmake; this is clang with the MSVC target)
        if: env.BUILD == 'true' && matrix.cross == 'xwin'
        shell: bash
        working-directory: acdebin-dbg
        env:
          CARGO_REGISTRIES_AC_TOKEN: Bearer ${{ secrets.ACKERNEL_TOKEN || github.token }}
        run: |
          set -eu
          cargo xwin env --target ${{ matrix.triple }} > /dev/null
          cargo fetch --target ${{ matrix.triple }}
          src=$(ls -d "${CARGO_HOME:-$HOME/.cargo}"/registry/src/*/openssl-src-*/openssl | sort -V | tail -1)
          x="$HOME/.cache/cargo-xwin/xwin"
          out="$RUNNER_TEMP/openssl"
          cp -r "$src" "$RUNNER_TEMP/openssl-build"
          cd "$RUNNER_TEMP/openssl-build"
          inc="-isystem $x/crt/include -isystem $x/sdk/include/ucrt -isystem $x/sdk/include/um -isystem $x/sdk/include/shared"
          CC=clang AR=llvm-ar RANLIB=llvm-ranlib CFLAGS="--target=${{ matrix.triple }} -O2 $inc -D_MT -Wno-everything" \
            perl ./Configure mingw64 --prefix="$out" --libdir=lib no-shared no-module no-tests no-comp no-zlib no-zlib-dynamic \
            no-ssl3 no-md2 no-rc5 no-weak-ssl-ciphers no-camellia no-idea no-seed no-capieng no-asm no-apps
          make -j"$(nproc)" build_libs > /dev/null
          mkdir -p "$out/lib" "$out/include"
          cp -r include/openssl "$out/include/"
          cp libcrypto.a "$out/lib/libcrypto.lib"
          cp libssl.a "$out/lib/libssl.lib"
          { echo "OPENSSL_NO_VENDOR=1"; echo "OPENSSL_STATIC=1"; echo "OPENSSL_DIR=$out"; } >> "$GITHUB_ENV"
      - name: the release version into Cargo.toml and package.json (not committed)
        if: env.BUILD == 'true'
        run: sh acdebin-dbg/scripts/set-version.sh "${{ needs.plan.outputs.version }}" acdebin-dbg acdert
      - name: rustc flags (static CRT on Windows, paths remapped, PDB by file name)
        if: env.BUILD == 'true'
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          sysroot=$(rustc --print sysroot)
          flags=""
          case "${{ matrix.triple }}" in
            *-windows-msvc) flags="-C target-feature=+crt-static -C link-arg=/PDBALTPATH:%_PDB%" ;;
          esac
          flags="$flags --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$sysroot=/rustc --remap-path-prefix=$GITHUB_WORKSPACE/acdebin-dbg=/src --remap-path-prefix=$GITHUB_WORKSPACE/acdert=/src/acdert"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
      - name: "acdebin-dbg (dist profile: release build, split debug information)"
        if: env.BUILD == 'true'
        shell: bash
        working-directory: acdebin-dbg
        env:
          CARGO_REGISTRIES_AC_TOKEN: Bearer ${{ secrets.ACKERNEL_TOKEN || github.token }}
        run: |
          case "${{ matrix.cross }}" in
            xwin) cargo xwin build --profile dist -p acdebin-dbg --target ${{ matrix.triple }} ;;
            zigbuild) cargo zigbuild --profile dist -p acdebin-dbg --target ${{ matrix.triple }} ;;
            *) cargo build --profile dist -p acdebin-dbg --target ${{ matrix.triple }} ;;
          esac
      - name: archive the binary (one file, fixed times and owner) and keep the split debug information
        if: env.BUILD == 'true'
        shell: bash
        run: |
          set -eu
          dist=acdebin-dbg/target/${{ matrix.triple }}/dist
          exe=acdebin-dbg${{ matrix.exe }}
          mkdir -p out one symbols
          cp "$dist/$exe" "one/$exe"
          chmod 755 "one/$exe"
          TZ=UTC touch -t 200001010000.00 "one/$exe"
          if tar --version 2>/dev/null | grep -q 'GNU tar'; then owner="--owner=0 --group=0"; else owner="--uid 0 --gid 0"; fi
          if [ -n "${{ matrix.exe }}" ]; then
            tar -C one --format=ustar $owner --numeric-owner -cf - "$exe" | gzip -9 -n > "out/acdebin-dbg-${{ matrix.triple }}.tar.gz"
          else
            tar -C one --format=ustar $owner --numeric-owner -cf - "$exe" | xz -9 -T1 -c > "out/acdebin-dbg-${{ matrix.triple }}.tar.xz"
          fi
          for part in acdebin-dbg.pdb acdebin_dbg.pdb acdebin-dbg.dwp acdebin_dbg.dwp acdebin-dbg.dSYM acdebin_dbg.dSYM; do
            if [ -e "$dist/$part" ]; then cp -RL "$dist/$part" symbols/; fi
          done
          if [ -z "$(ls -A symbols)" ]; then echo "::error::no split debug information was produced"; exit 1; fi
          ls -la out symbols
      - uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7 (official v7.0.2 + isGhes false)
        if: env.BUILD == 'true'
        with:
          name: runtime-${{ matrix.triple }}
          path: out
          retention-days: 1
      - uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7 (official v7.0.2 + isGhes false)
        if: env.BUILD == 'true'
        with:
          name: symbols-${{ matrix.triple }}
          path: symbols
          retention-days: 30
          if-no-files-found: error

  host:
    needs: plan
    runs-on: debian12
    container: node:22-bookworm
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: acdert at the planned commit
        env:
          TOKEN: ${{ secrets.ACKERNEL_TOKEN || github.token }}
          ACDERT_SHA: ${{ needs.plan.outputs.acdert_sha }}
        run: |
          set -eu
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraHeader="Authorization: basic ${auth}" clone --filter=blob:none --no-checkout "$GITHUB_SERVER_URL/AC/acdert.git" acdert
          git -c http.extraHeader="Authorization: basic ${auth}" -C acdert checkout --detach "$ACDERT_SHA"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: "host bundle (release build: minified, obfuscated, no source maps)"
        working-directory: acdert/web
        run: |
          bun install --frozen-lockfile
          node -e 'for (const p of ["acde-api","acde-host","acde-dom"]) { const f=`packages/${p}/package.json`, j=JSON.parse(require("fs").readFileSync(f,"utf8")); j.version=process.env.VERSION; require("fs").writeFileSync(f, JSON.stringify(j,null,2)+"\n") }'
          bun run --filter @dopame/acde-host build:release
      - name: acde-host-<version>.tar.gz (app/ and LICENSE), checked for source-like files
        run: |
          set -eu
          mkdir -p stage/app out
          cp -r acdert/web/packages/acde-host/dist-release stage/app/dist
          cp -r acdert/web/packages/acde-host/brand acdert/web/packages/acde-host/greet acdert/web/packages/acde-host/package.json stage/app/
          cp acdert/LICENSE stage/LICENSE
          bun acdert/web/packages/acde-host/scripts/check-release.mjs stage/app/dist
          leaks=$(find stage -name '*.map' -o -name '*.ts' -o -name '*.tsx')
          if [ -n "$leaks" ]; then echo "::error::source-like files in the host files:"; echo "$leaks"; exit 1; fi
          tar -C stage -czf "out/acde-host-$VERSION.tar.gz" app LICENSE
      - uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7 (official v7.0.2 + isGhes false)
        with:
          name: runtime-host
          path: out
          retention-days: 1

  pkgs:
    needs: [plan, build, host]
    runs-on: debian12
    container: node:22-bookworm
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      SDK_VERSION: ${{ needs.plan.outputs.version }}
      TARGETS: ${{ needs.plan.outputs.targets }}
    steps:
      - name: tools from Debian 12
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends jq xz-utils > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acdebin-dbg
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: acdert at the planned commit, beside acdebin-dbg (npm/ takes the SDK from ../../acdert)
        env:
          TOKEN: ${{ secrets.ACKERNEL_TOKEN || github.token }}
          ACDERT_SHA: ${{ needs.plan.outputs.acdert_sha }}
        run: |
          set -eu
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraHeader="Authorization: basic ${auth}" clone --filter=blob:none --no-checkout "$GITHUB_SERVER_URL/AC/acdert.git" acdert
          git -c http.extraHeader="Authorization: basic ${auth}" -C acdert checkout --detach "$ACDERT_SHA"
      - uses: christopherhx/gitea-download-artifact@3f0bddcec1b25ce059fe5de36de56d8d8519397f # v8 (official v8.0.1 + isGhes false)
        with:
          path: in
      - name: the builds of the planned targets and the host files, nothing else
        run: |
          set -eu
          mkdir -p in/runtime
          for t in $(echo "$TARGETS" | tr , ' '); do
            case $t in *-windows-msvc) f="acdebin-dbg-$t.tar.gz" ;; *) f="acdebin-dbg-$t.tar.xz" ;; esac
            test -f "in/runtime-$t/$f" || { echo "::error::no $f from the build of $t"; exit 1; }
            cp "in/runtime-$t/$f" in/runtime/
          done
          test -f "in/runtime-host/acde-host-$SDK_VERSION.tar.gz" || { echo "::error::no acde-host-$SDK_VERSION.tar.gz"; exit 1; }
          cp "in/runtime-host/acde-host-$SDK_VERSION.tar.gz" in/runtime/
          ls -la in/runtime
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        run: bun install --frozen-lockfile --cwd acdert/web && bun install --frozen-lockfile --cwd acdebin-dbg/npm
      - name: the release version into Cargo.toml and package.json (not committed)
        run: sh acdebin-dbg/scripts/set-version.sh "$SDK_VERSION" acdebin-dbg acdert
      - name: the SDK, built from the acdert checkout
        run: bun run --cwd acdert/web/packages/acde-api build
      - name: dist
        working-directory: acdebin-dbg/npm
        run: |
          v=${TAG#v}
          bun scripts/dist.ts --api "$GITHUB_WORKSPACE/acdert/web/packages/acde-api/dist" --sdk "$SDK_VERSION" \
            --version "$v" --out "$GITHUB_WORKSPACE/out" --runtime "$GITHUB_WORKSPACE/in/runtime"
      - name: latest.json
        run: |
          v=${TAG#v}
          files=$(cd "$GITHUB_WORKSPACE/out/$v" && ls | jq -R . | jq -sc .)
          jq -n --arg version "$v" --arg tag "$TAG" --arg commit "$SHA" --arg sdk "$SDK_VERSION" \
            --argjson files "$files" \
            '{version: $version, tag: $tag, commit: $commit, sdk: $sdk, base: "https://pkgs.dopame.ai/acde/\($version)/", files: $files}' \
            > "$GITHUB_WORKSPACE/out/latest.json"
          cat "$GITHUB_WORKSPACE/out/latest.json"
      - name: the archive starts the CLI
        run: |
          set -eu
          v=${TAG#v}
          mkdir -p smoke
          tar -xzf "$GITHUB_WORKSPACE/out/$v/acde-$v.tar.gz" -C smoke
          out=$("smoke/acde-$v/bin/acde" --help 2>&1 || true)
          case $out in
            *'Usage: acde <command>'*) echo "shim ok" ;;
            *)
              printf '%s\n' "$out"
              echo "::error::bin/acde does not start the CLI"
              exit 1
              ;;
          esac
      - uses: christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7 (official v7.0.2 + isGhes false)
        with:
          name: acde-release
          path: out
          if-no-files-found: error
          retention-days: 1

  guard:
    needs: [plan, pkgs]
    runs-on: debian12
    container: node:22-bookworm
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      TARGETS: ${{ needs.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acdebin-dbg
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: christopherhx/gitea-download-artifact@3f0bddcec1b25ce059fe5de36de56d8d8519397f # v8 (official v8.0.1 + isGhes false)
        with:
          name: acde-release
          path: out
      - name: the release is exactly the allow-list and the shipped content is clean
        working-directory: acdebin-dbg/npm
        run: |
          set -eu
          v=$(cat "$GITHUB_WORKSPACE/out/latest")
          if [ "v$v" != "$TAG" ]; then
            echo "::error::the release is $v but the tag is $TAG"
            exit 1
          fi
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends xz-utils > /dev/null
          bun ../scripts/release-guard.ts --dir "$GITHUB_WORKSPACE/out" --version "$v" --targets "$TARGETS"
      - name: a preview stops here
        if: needs.plan.outputs.publish != 'true'
        run: |
          echo "preview only: the archive passed the guard; no tag and no upload" >> "$GITHUB_STEP_SUMMARY"

  upload:
    needs: [plan, guard]
    if: needs.plan.outputs.publish == 'true' && needs.guard.result == 'success'
    runs-on: debian12
    container: node:22-bookworm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      TARGETS: ${{ needs.plan.outputs.targets }}
    steps:
      - name: tools from Debian 12
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends jq awscli > /dev/null
      - uses: christopherhx/gitea-download-artifact@3f0bddcec1b25ce059fe5de36de56d8d8519397f # v8 (official v8.0.1 + isGhes false)
        with:
          name: acde-release
          path: out
      - name: check the allow-list and the checksums once more
        run: |
          set -eu
          v=$(cat out/latest)
          case $v in *[!0-9A-Za-z.-]*|'') echo "::error::bad version"; exit 1 ;; esac
          if [ "v$v" != "$TAG" ]; then
            echo "::error::the release is $v but the tag is $TAG"
            exit 1
          fi
          expected=$(mktemp)
          {
            echo install.md
            echo install.ps1
            echo install.sh
            echo latest
            echo latest.json
            echo "$v/SHA256SUMS"
            echo "$v/acde-$v.tar.gz"
            echo "$v/acde-api-$v.tar.gz"
            echo "$v/acde-host-$v.tar.gz"
            for t in $(echo "$TARGETS" | tr , ' '); do
              case $t in *-windows-msvc) echo "$v/acdebin-dbg-$t.tar.gz" ;; *) echo "$v/acdebin-dbg-$t.tar.xz" ;; esac
            done
          } | sort > "$expected"
          (cd out && find . -type f | sed 's|^\./||' | sort) > actual
          if ! diff "$expected" actual; then
            echo "::error::the release is not exactly the allow-list"
            exit 1
          fi
          (cd "out/$v" && sha256sum -c SHA256SUMS)
      - name: credentials for the role, from the Gitea key or the GitHub OIDC token
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          if [ -n "${KEY_ID:-}" ]; then
            creds=$(AWS_ACCESS_KEY_ID="$KEY_ID" AWS_SECRET_ACCESS_KEY="$KEY_SECRET" aws sts assume-role --role-arn "$ROLE" \
              --role-session-name "acde-$GITHUB_RUN_ID" --duration-seconds 3600 --query Credentials --output json)
          else
            token=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
            echo "::add-mask::$token"
            creds=$(aws sts assume-role-with-web-identity --role-arn "$ROLE" \
              --role-session-name "acde-$GITHUB_RUN_ID" --web-identity-token "$token" \
              --duration-seconds 3600 --query Credentials --output json)
          fi
          key=$(jq -r .AccessKeyId <<< "$creds")
          secret=$(jq -r .SecretAccessKey <<< "$creds")
          session=$(jq -r .SessionToken <<< "$creds")
          echo "::add-mask::$key"
          echo "::add-mask::$secret"
          echo "::add-mask::$session"
          {
            echo "AWS_ACCESS_KEY_ID=$key"
            echo "AWS_SECRET_ACCESS_KEY=$secret"
            echo "AWS_SESSION_TOKEN=$session"
          } >> "$GITHUB_ENV"
      - name: upload the versioned files, then read them back
        run: |
          set -eu
          v=$(cat out/latest)
          immutable='public, max-age=31536000, immutable'
          text='text/plain; charset=utf-8'
          put() { aws s3 cp "$1" "s3://$BUCKET/$PREFIX/$2" --only-show-errors --content-type "$3" --cache-control "$4"; }
          # a published version is identical or refused, never overwritten; a rerun skips the identical files
          publish_once() {
            key="$PREFIX/$2"
            if aws s3api head-object --bucket "$BUCKET" --key "$key" > /dev/null 2> head.err; then
              aws s3 cp "s3://$BUCKET/$key" published.tmp --only-show-errors
              if cmp -s published.tmp "$1"; then
                echo "already published, identical: $2"
              else
                echo "::error::$2 is already published with different content: a version is never overwritten"
                exit 1
              fi
            elif grep -qE 'Not Found|NotFound|404' head.err; then
              put "$1" "$2" "$3" "$4"
            else
              echo "::error::cannot check $2: $(cat head.err)"
              exit 1
            fi
            aws s3 cp "s3://$BUCKET/$key" readback.tmp --only-show-errors
            cmp -s readback.tmp "$1" || { echo "::error::$2 does not read back as uploaded"; exit 1; }
          }
          publish_once "out/$v/acde-$v.tar.gz" "$v/acde-$v.tar.gz" application/gzip "$immutable"
          publish_once "out/$v/acde-api-$v.tar.gz" "$v/acde-api-$v.tar.gz" application/gzip "$immutable"
          publish_once "out/$v/acde-host-$v.tar.gz" "$v/acde-host-$v.tar.gz" application/gzip "$immutable"
          for t in $(echo "$TARGETS" | tr , ' '); do
            case $t in
              *-windows-msvc) publish_once "out/$v/acdebin-dbg-$t.tar.gz" "$v/acdebin-dbg-$t.tar.gz" application/gzip "$immutable" ;;
              *) publish_once "out/$v/acdebin-dbg-$t.tar.xz" "$v/acdebin-dbg-$t.tar.xz" application/x-xz "$immutable" ;;
            esac
          done
          publish_once "out/$v/SHA256SUMS" "$v/SHA256SUMS" "$text" "$immutable"

  npm:
    # npm: @dopame/acde (one line of JS that starts its platform package), @dopame/acde-<os>-<cpu> (the binaries, the
    # built CLI and the host files, laid out as an install), and the SDK @dopame/acde-api; a version already there is skipped
    needs: [plan, guard]
    if: needs.plan.outputs.publish == 'true'
    runs-on: debian12
    container: node:22-bookworm
    env:
      V: ${{ needs.plan.outputs.version }}
      TARGETS: ${{ needs.plan.outputs.targets }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: christopherhx/gitea-download-artifact@3f0bddcec1b25ce059fe5de36de56d8d8519397f # v8 (official v8.0.1 + isGhes false)
        with:
          name: acde-release
          path: out
      - name: the packages
        run: |
          set -eu
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends xz-utils > /dev/null
          rel="$GITHUB_WORKSPACE/out/$V"
          mkdir -p npm
          deps=
          for t in $(echo "$TARGETS" | tr , ' '); do
            case $t in
              x86_64-unknown-linux-gnu) os=linux cpu=x64 exe= ;;
              aarch64-apple-darwin) os=darwin cpu=arm64 exe= ;;
              x86_64-apple-darwin) os=darwin cpu=x64 exe= ;;
              x86_64-pc-windows-msvc) os=win32 cpu=x64 exe=.exe ;;
              *) echo "::error::no npm platform for $t"; exit 1 ;;
            esac
            name="@dopame/acde-$os-$cpu"
            dir="npm/acde-$os-$cpu"
            mkdir -p "$dir.stage" "$dir"
            tar -xzf "$rel/acde-$V.tar.gz" -C "$dir.stage"
            cp -a "$dir.stage/acde-$V/." "$dir/"
            case $t in
              *-windows-msvc) tar -xzf "$rel/acdebin-dbg-$t.tar.gz" -C "$dir/bin" ;;
              *) tar -xJf "$rel/acdebin-dbg-$t.tar.xz" -C "$dir/bin" ;;
            esac
            test -f "$dir/bin/acdebin-dbg$exe"
            tar -xzf "$rel/acde-host-$V.tar.gz" -C "$dir.stage" app
            mv "$dir.stage/app" "$dir/bin/app"
            rm -rf "$dir.stage"
            node -e 'const [name,v,os,cpu]=process.argv.slice(1); process.stdout.write(JSON.stringify({name, version: v, description: `acde for ${os}-${cpu}: the acdebin-dbg runtime, the acde CLI and the host files`, license: "UNLICENSED", os: [os], cpu: [cpu], preferUnplugged: true}, null, 2) + "\n")' \
              "$name" "$V" "$os" "$cpu" > "$dir/package.json"
            deps="$deps\"$name\": \"$V\","
          done
          mkdir -p npm/acde
          printf '%s\n' '#!/usr/bin/env node' \
            'import(`@dopame/acde-${process.platform}-${process.arch}/lib/acde/launcher.mjs`).then(async (m) => process.exit(await m.run(process.argv.slice(2))), (e) => { process.stderr.write(`acde: no acde for ${process.platform}-${process.arch} (${e.message})\n`); process.exit(1) })' \
            > npm/acde/acde.mjs
          node -e 'const [v,deps]=process.argv.slice(1); process.stdout.write(JSON.stringify({name: "@dopame/acde", version: v, description: "acde: build, run and debug acde apps", license: "UNLICENSED", type: "module", bin: {acde: "acde.mjs"}, engines: {node: ">=22.3"}, optionalDependencies: JSON.parse(`{${deps.replace(/,$/, "")}}`)}, null, 2) + "\n")' \
            "$V" "$deps" > npm/acde/package.json
          mkdir -p npm/acde-api.stage
          tar -xzf "$(ls "$rel"/acde-api-*.tar.gz)" -C npm/acde-api.stage
          mv npm/acde-api.stage/package npm/acde-api && rm -rf npm/acde-api.stage
          cat npm/acde/package.json npm/acde/acde.mjs
          du -sh npm/*
      - name: publish (platforms, the SDK, then @dopame/acde)
        run: |
          set -eu
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::no NPM_TOKEN secret: nothing published to npm"
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          npm whoami
          for dir in npm/acde-*-* npm/acde-api npm/acde; do
            [ -d "$dir" ] || continue
            case $dir in *.stage) continue ;; esac
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version > /dev/null 2>&1; then
              echo "$name@$ver is already on npm"
              continue
            fi
            (cd "$dir" && npm publish --access public)
            echo "published $name@$ver"
          done

  tag:
    needs: [plan, guard, upload]
    if: needs.plan.outputs.publish == 'true' && needs.upload.result == 'success'
    runs-on: debian12
    container: node:22-bookworm
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acdebin-dbg
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: true
      - name: the annotated tag points at the commit, or already does
        working-directory: acdebin-dbg/npm
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            peeled=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f 1)
            if [ -z "$peeled" ]; then
              peeled=$(git ls-remote origin "refs/tags/$TAG" | cut -f 1)
            fi
            if [ "$peeled" != "$SHA" ]; then
              echo "::error::$TAG already exists and points at $peeled, not at $SHA: bump the version in package.json"
              exit 1
            fi
            echo "$TAG already points at $SHA: a rerun continues"
          else
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              tag -a "$TAG" -m "acde $TAG" "$SHA"
            git push origin "refs/tags/$TAG"
            echo "pushed $TAG at $SHA"
          fi

  latest:
    needs: [plan, guard, tag]
    if: needs.plan.outputs.publish == 'true' && needs.tag.result == 'success'
    runs-on: debian12
    container: node:22-bookworm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: tools from Debian 12
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends jq awscli > /dev/null
      - uses: christopherhx/gitea-download-artifact@3f0bddcec1b25ce059fe5de36de56d8d8519397f # v8 (official v8.0.1 + isGhes false)
        with:
          name: acde-release
          path: out
      - name: check the allow-list and the checksums once more
        run: |
          set -eu
          v=$(cat out/latest)
          case $v in *[!0-9A-Za-z.-]*|'') echo "::error::bad version"; exit 1 ;; esac
          if [ "v$v" != "$TAG" ]; then
            echo "::error::the release is $v but the tag is $TAG"
            exit 1
          fi
          (cd "out/$v" && sha256sum -c SHA256SUMS)
      - name: credentials for the role, from the Gitea key or the GitHub OIDC token
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          if [ -n "${KEY_ID:-}" ]; then
            creds=$(AWS_ACCESS_KEY_ID="$KEY_ID" AWS_SECRET_ACCESS_KEY="$KEY_SECRET" aws sts assume-role --role-arn "$ROLE" \
              --role-session-name "acde-$GITHUB_RUN_ID" --duration-seconds 3600 --query Credentials --output json)
          else
            token=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
            echo "::add-mask::$token"
            creds=$(aws sts assume-role-with-web-identity --role-arn "$ROLE" \
              --role-session-name "acde-$GITHUB_RUN_ID" --web-identity-token "$token" \
              --duration-seconds 3600 --query Credentials --output json)
          fi
          key=$(jq -r .AccessKeyId <<< "$creds")
          secret=$(jq -r .SecretAccessKey <<< "$creds")
          session=$(jq -r .SessionToken <<< "$creds")
          echo "::add-mask::$key"
          echo "::add-mask::$secret"
          echo "::add-mask::$session"
          {
            echo "AWS_ACCESS_KEY_ID=$key"
            echo "AWS_SECRET_ACCESS_KEY=$secret"
            echo "AWS_SESSION_TOKEN=$session"
          } >> "$GITHUB_ENV"
      - name: update the pointers, latest.json last
        run: |
          set -eu
          v=$(cat out/latest)
          fresh='public, max-age=0, must-revalidate'
          text='text/plain; charset=utf-8'
          put() { aws s3 cp "$1" "s3://$BUCKET/$PREFIX/$2" --only-show-errors --content-type "$3" --cache-control "$4"; }
          put out/install.sh install.sh "$text" "$fresh"
          put out/install.ps1 install.ps1 "$text" "$fresh"
          put out/install.md install.md 'text/markdown; charset=utf-8' "$fresh"
          put out/latest latest "$text" "$fresh"
          put out/latest.json latest.json application/json "$fresh"
      - name: invalidate
        run: |
          set -eu
          v=$(cat out/latest)
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION" \
            --paths /acde/latest /acde/latest.json /acde/install.sh /acde/install.ps1 /acde/install.md \
            "/acde/$v/*" --query Invalidation.Id --output text
      - run: |
          {
            echo "curl -fsSL https://pkgs.dopame.ai/acde/install.sh | sh"
            echo
            echo "irm https://pkgs.dopame.ai/acde/install.ps1 | iex"
            echo
            echo "Read https://pkgs.dopame.ai/acde/install.md and follow it to set up acde on this machine."
          } >> "$GITHUB_STEP_SUMMARY"
