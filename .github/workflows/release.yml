name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'false rehearses (builds and checks only); true publishes a new release from main'
        type: boolean
        default: false
      commit:
        description: 'full or short sha on origin/main to publish or rehearse; a formal release needs it, a rehearsal defaults to the run commit'
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  plan:
    runs-on: ubuntu-24.04
    concurrency:
      group: release-prepare-${{ inputs.publish && 'publish' || 'rehearsal' }}-${{ github.ref }}-plan
      cancel-in-progress: ${{ !inputs.publish }}
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: version, tag and mode (preview, new, resume)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PUBLISH: ${{ inputs.publish }}
          COMMIT: ${{ inputs.commit }}
        run: scripts/release/plan.sh "$EVENT" "$REF_TYPE" "$REF_NAME" "$SHA" "$PUBLISH" "$COMMIT"

  build:
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    concurrency:
      group: release-prepare-${{ inputs.publish && 'publish' || 'rehearsal' }}-${{ github.ref }}-build-${{ matrix.triple }}
      cancel-in-progress: ${{ !inputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-apple-darwin, os: macos-15 }
          - { triple: x86_64-apple-darwin, os: macos-15-intel }
          - { triple: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { triple: x86_64-pc-windows-msvc, os: windows-2025, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          clang pkg-config libssl-dev libdrm-dev libgbm-dev libinput-dev libudev-dev
          libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
          libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: nasm
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/nasm.zip" > /dev/null
          cygpath -w "$RUNNER_TEMP/nasm-3.02" >> "$GITHUB_PATH"
      - name: python for stylo
        if: runner.os == 'Windows'
        shell: bash
        run: echo "PYTHON3=$(cygpath -w "$(command -v python)")" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.triple }}
      - name: rustc flags (static CRT on Windows, paths remapped, PDB by file name)
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          sysroot=$(rustc --print sysroot)
          workspace="$GITHUB_WORKSPACE"
          flags=""
          case "$(uname -s)" in
            MINGW* | MSYS* | CYGWIN*)
              cargo_home=$(cygpath -w "$cargo_home")
              sysroot=$(cygpath -w "$sysroot")
              workspace=$(cygpath -w "$workspace")
              flags="-C target-feature=+crt-static -C link-arg=/PDBALTPATH:%_PDB%"
              ;;
          esac
          flags="$flags --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$sysroot=/rustc --remap-path-prefix=$workspace=/src"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
      - name: "acdert (dist profile: release build, split debug information)"
        run: cargo build --profile dist -p acdert --target ${{ matrix.triple }}
      - name: stage binary and split debug information
        shell: bash
        run: |
          dist=target/${{ matrix.triple }}/dist
          mkdir -p out symbols
          cp "$dist/acdert${{ matrix.exe }}" "out/acdert-${{ matrix.triple }}${{ matrix.exe }}"
          for part in acdert.pdb acdert.dwp acdert.dSYM; do
            if [ -e "$dist/$part" ]; then cp -RL "$dist/$part" symbols/; fi
          done
          if [ -z "$(ls -A symbols)" ]; then echo "::error::no split debug information was produced"; exit 1; fi
          ls -la out symbols
      - uses: actions/upload-artifact@v7
        with:
          name: acdert-${{ matrix.triple }}
          path: out
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.triple }}
          path: symbols
          retention-days: 30
          if-no-files-found: error

  host:
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    concurrency:
      group: release-prepare-${{ inputs.publish && 'publish' || 'rehearsal' }}-${{ github.ref }}-host
      cancel-in-progress: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
      - name: "host bundle (release build: minified, obfuscated, no source maps)"
        working-directory: web
        run: bun install --frozen-lockfile && bun run --filter @dopame/acde-host build:release
      - name: stage
        run: |
          mkdir -p out/app
          cp -r web/packages/acde-host/dist-release out/app/dist
          cp -r web/packages/acde-host/brand web/packages/acde-host/greet web/packages/acde-host/package.json out/app/
          cp LICENSE out/LICENSE
      - name: leak check
        run: |
          bun web/packages/acde-host/scripts/check-release.mjs out/app/dist
          leaks=$(find out -name '*.map' -o -name '*.ts' -o -name '*.tsx' -o -name '*.ts.map')
          if [ -n "$leaks" ]; then echo "::error::source-like files in the host artifact:"; echo "$leaks"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: host
          path: out
          retention-days: 1

  stage:
    needs: [plan, build, host]
    if: ${{ needs.plan.result == 'success' && needs.build.result == 'success' && needs.host.result == 'success' }}
    concurrency:
      group: release-prepare-${{ inputs.publish && 'publish' || 'rehearsal' }}-${{ github.ref }}-stage
      cancel-in-progress: ${{ !inputs.publish }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: oven-sh/setup-bun@v2
      - name: web workspace (builds the acde-api SDK for its archive)
        run: bun install --frozen-lockfile --cwd web
      - name: stage the release files (explicit allow-list; symbol artifacts are never read)
        run: scripts/release/stage.sh artifacts "$VERSION" out
      - uses: actions/upload-artifact@v7
        with:
          name: release-stage
          path: out
          retention-days: 1

  tag:
    needs: [plan, upload]
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.mode == 'new' && needs.upload.result == 'success' }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: annotated tag on the commit that passed the checks
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" -m "acdert $TAG" "$SHA"
          git push origin "refs/tags/$TAG"

  release:
    needs: [plan, upload, tag]
    if: ${{ needs.plan.result == 'success' && needs.upload.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') && (needs.plan.outputs.mode == 'new' || needs.plan.outputs.mode == 'resume') }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-stage
          path: release-stage
      - name: check the staging before upload
        run: scripts/release/check-stage.sh release-stage "$VERSION"
      - name: GitHub release (created once, a re-run replaces the assets)
        run: |
          files=(acdert-x86_64-unknown-linux-gnu acdert-aarch64-apple-darwin acdert-x86_64-apple-darwin acdert-x86_64-pc-windows-msvc.exe "acdert-host-$VERSION.tar.gz" LICENSE)
          level=$(sed -n 's/^export const API_LEVEL = \([0-9][0-9]*\).*/\1/p' web/packages/acde-api/src/runtime/level.js)
          test -n "$level"
          notes="Contract level $level: packages need \"apiLevel\": $level (packages without it, or built for another level, are refused; rebuild them with the current acde).
          The runtime is not yet a security boundary: until the third-party sandbox ships, local and developer builds run as the developer's own code.
          Release builds (split debug information is not attached). Put the app/ directory from acdert-host-$VERSION.tar.gz next to the binary."
          cd release-stage
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$TAG" --notes "$notes" \
              "${files[@]}"
          fi

  upload:
    needs: [plan, stage]
    if: ${{ needs.plan.result == 'success' && needs.stage.result == 'success' && (needs.plan.outputs.mode == 'new' || needs.plan.outputs.mode == 'resume') }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: release-stage
          path: release-stage
      - name: check the staging and build the pkgs directory
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          scripts/release/check-stage.sh release-stage "$VERSION"
          mkdir -p "pkgs/$VERSION"
          cp release-stage/acdert-x86_64-unknown-linux-gnu release-stage/acdert-aarch64-apple-darwin release-stage/acdert-x86_64-apple-darwin \
            release-stage/acdert-x86_64-pc-windows-msvc.exe "release-stage/acdert-host-$VERSION.tar.gz" release-stage/LICENSE \
            "release-stage/acde-api-$VERSION.tar.gz" "pkgs/$VERSION/"
          (cd "pkgs/$VERSION" && sha256sum -- * > SHA256SUMS)
          scripts/release/check-stage.sh "pkgs/$VERSION" "$VERSION"
          files=$(cd "pkgs/$VERSION" && ls | jq -R . | jq -sc .)
          jq -n --arg version "$VERSION" --arg tag "$TAG" --arg commit "$SHA" --argjson files "$files" \
            '{version: $version, tag: $tag, commit: $commit, base: "https://pkgs.dopame.ai/acdert/\($version)/", files: $files}' \
            > pkgs/latest.json
          cat pkgs/latest.json
      - uses: actions/upload-artifact@v7
        with:
          name: pkgs-latest
          path: pkgs/latest.json
          retention-days: 1
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::312030312811:role/dopame-acdert-release
          aws-region: ap-southeast-1
      - name: upload the version directory (same content is skipped, different content is refused)
        run: |
          cd "pkgs/$VERSION"
          for f in *; do
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            key="acdert/$VERSION/$f"
            if head=$(aws s3api head-object --bucket dopame-pkgs --key "$key" --query 'Metadata.sha256' --output text 2> "$RUNNER_TEMP/s3-head.err"); then
              if [ "$head" = "$sum" ]; then
                echo "skip $f: the same content is already in S3"
                continue
              fi
              echo "::error::$key is in S3 with sha256 $head, not $sum (missing or different metadata); refusing to overwrite"
              exit 1
            fi
            if ! grep -q '(404)' "$RUNNER_TEMP/s3-head.err"; then
              cat "$RUNNER_TEMP/s3-head.err"
              exit 1
            fi
            aws s3 cp "$f" "s3://dopame-pkgs/$key" \
              --cache-control 'public, max-age=31536000, immutable' --metadata "sha256=$sum"
          done
      - name: verify every object of the version directory before the tag
        run: |
          cd "pkgs/$VERSION"
          for f in *; do
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            remote=$(aws s3api head-object --bucket dopame-pkgs --key "acdert/$VERSION/$f" --query 'Metadata.sha256' --output text)
            if [ "$remote" != "$sum" ]; then echo "::error::acdert/$VERSION/$f does not match the local file ($remote, not $sum)"; exit 1; fi
          done

  latest:
    needs: [plan, upload, release]
    if: ${{ needs.plan.result == 'success' && needs.upload.result == 'success' && needs.release.result == 'success' }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pkgs-latest
          path: pkgs-latest
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::312030312811:role/dopame-acdert-release
          aws-region: ap-southeast-1
      - name: 'latest.json (last: the version directory is verified and the GitHub release exists)'
        run: |
          aws s3 cp pkgs-latest/latest.json s3://dopame-pkgs/acdert/latest.json \
            --content-type application/json --cache-control 'public, max-age=0, must-revalidate'
      - name: invalidate the version directory and latest.json
        run: aws cloudfront create-invalidation --distribution-id E3ET3L14ALFOXX --paths "/acdert/latest.json" "/acdert/$VERSION/*" --query Invalidation.Id --output text
      - run: echo "https://pkgs.dopame.ai/acdert/$VERSION/" >> "$GITHUB_STEP_SUMMARY"

  npm-build:
    needs: [plan, latest]
    if: ${{ vars.NPM_PUBLISH == 'true' && needs.latest.result == 'success' }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: check version
        id: version
        working-directory: web/packages/acde-api
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$TAG" ] || { echo "::error::$name is $version but the tag is $TAG"; exit 1; }
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "::notice::$name@$version is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.publish == 'true'
      - name: build
        if: steps.version.outputs.publish == 'true'
        run: |
          bun install --frozen-lockfile --cwd web
          bun run --cwd web/packages/acde-api build
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.publish == 'true'
        with:
          name: acde-api
          path: web/packages/acde-api/dist
          retention-days: 1

  npm:
    needs: npm-build
    if: ${{ needs.npm-build.outputs.publish == 'true' }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: acde-api
          path: dist
      - name: publish
        working-directory: dist
        run: |
          npm_version=$(npm --version)
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$npm_version" \
            || { echo "::error::trusted publishing needs npm 11.5.1 or later, the runner has $npm_version"; exit 1; }
          npm publish --ignore-scripts
