name: cicd

# By hand on Gitea: build, check and preview. Publish: tick publish and give commit=<sha>, or push a tag v<x.y.z>.
# What ships, where and in which order: docs/release-distribution.md. The runners' toolchains: scripts/runner-setup.sh.
# Every job's output goes to the artifacts host (.127): written with rsync over ssh, read with nc + tar.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'false: build and check only. true: tag v<version> and publish (main only, commit required)'
        required: false
        default: false
        type: boolean
      commit:
        description: 'full or short SHA of a commit on origin/main (required for publish=true)'
        required: false
        default: ''
        type: string
      version:
        description: 'x.y.z to release as; empty counts up from the highest released version'
        required: false
        default: ''
        type: string
      skip_targets:
        description: 'targets not to build or ship this time, comma-separated without spaces (e.g. aarch64-apple-darwin)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: acdev-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eu {0}

env:
  # PKGS serves the R2 bucket R2_BUCKET read-only (a Worker: the path is the key, no CDN to invalidate)
  PKGS: https://pkgs.dopame.ai
  R2_BUCKET: pkgs
  PREFIX: acdev
  RUSTUP_HOME: /opt/rust/rustup
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  GIT_TERMINAL_PROMPT: '0'
  # artifacts@.127:/srv/artifacts/acdev/<run number>/ (write) and its nc + tar reader (one path per connection)
  TO: artifacts@192.168.10.127
  PULL: 192.168.10.127 9127

jobs:
  plan:
    runs-on: x86_64-debian
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      sha: ${{ steps.version.outputs.sha }}
      libacde: ${{ steps.version.outputs.libacde }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      targets: ${{ steps.version.outputs.targets }}
    steps:
      - uses: http://gitea.dopamine/mirror/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acdev
          fetch-depth: 0
          persist-credentials: false
      - name: the commit (a full SHA on origin/main), the version, libacde's main and the targets
        id: version
        working-directory: acdev
        env:
          PUBLISH_INPUT: ${{ github.event.inputs.publish }}
          COMMIT: ${{ github.event.inputs.commit }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          SKIP: ${{ github.event.inputs.skip_targets }}
          TOKEN: ${{ secrets.ACKERNEL_TOKEN }}
        run: |
          # Gitea gives inputs.publish as false even when ticked; in the environment it is the text true
          if [ "${PUBLISH_INPUT:-}" = true ]; then PUBLISH=true; else PUBLISH=false; fi
          PUSHED_TAG=
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/v*) PUBLISH=true; COMMIT=$GITHUB_SHA; PUSHED_TAG=${GITHUB_REF#refs/tags/} ;;
          esac
          if [ -z "${COMMIT:-}" ]; then
            [ "$PUBLISH" = true ] && { echo "::error::a publish needs a commit: run it with -f commit=<sha>"; exit 1; }
            sha=$GITHUB_SHA
          else
            sha=$(git rev-parse --verify --quiet "$COMMIT^{commit}") || { echo "::error::$COMMIT is not a commit in this repository"; exit 1; }
          fi
          if [ "$PUBLISH" = true ] || [ -n "${COMMIT:-}" ]; then
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is neither origin/main nor one of its ancestors"; exit 1; }
          fi
          if [ "$PUBLISH" = true ] && [ -z "$PUSHED_TAG" ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a release is published from main only; this run is on $GITHUB_REF"
            exit 1
          fi
          git checkout --quiet --detach "$sha"
          if [ -n "$PUSHED_TAG" ]; then
            v=${PUSHED_TAG#v}
          elif [ -n "${VERSION_INPUT:-}" ]; then
            v=${VERSION_INPUT#v}
          else
            # one patch past the highest version released anywhere: pkgs' latest.json, npm, and the v* tags
            seen=$( {
              curl -fsSL "$PKGS/$PREFIX/latest.json" 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' 2>/dev/null || true
              for pkg in @dopame/acdev @acde/api; do npm view "$pkg" versions --json 2>/dev/null | node -p 'const v=JSON.parse(require("fs").readFileSync(0,"utf8"));(Array.isArray(v)?v:[v]).join("\n")' 2>/dev/null || true; done
              git tag --list 'v*' | sed 's/^v//'
            } | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            v=$(echo "${seen:-0.0.0}" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          fi
          case $v in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::version $v is not x.y.z"; exit 1 ;; esac
          if [ "$PUBLISH" = true ] && tagged=$(git rev-parse --verify --quiet "refs/tags/v$v^{commit}") && [ "$tagged" != "$sha" ]; then
            echo "::error::v$v already exists and points at $tagged, not at $sha"
            exit 1
          fi
          # libacde's main, the one commit every job builds
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          lib=$(git -c http.extraHeader="Authorization: basic ${auth}" ls-remote "$GITHUB_SERVER_URL/AC/libacde.git" refs/heads/main | cut -f 1)
          [ -n "$lib" ] || { echo "::error::no main in AC/libacde"; exit 1; }
          # a publish of a commit and version pkgs already made takes that libacde, so every job reuses its output (built/ on .127)
          if [ "$PUBLISH" = true ]; then
            was=$(printf 'acdev/built/libacde-%s-%s\n' "$sha" "$v" | nc $PULL | tar -xO 2>/dev/null || true)
            if printf '%s' "$was" | grep -qxE '[0-9a-f]{40}' && [ "$was" != "$lib" ]; then
              echo "::notice::libacde $was, as when $sha was last built as $v (main is $lib)"
              lib=$was
            fi
          fi
          all="x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc"
          for s in $(echo "${SKIP:-}" | tr , ' '); do
            case " $all " in *" $s "*) ;; *) echo "::error::unknown target to skip: $s (one of $all)"; exit 1 ;; esac
          done
          left=
          for t in $all; do case ",${SKIP:-}," in *",$t,"*) ;; *) left="$left,$t" ;; esac; done
          [ -n "$left" ] || { echo "::error::skip_targets leaves no target to build"; exit 1; }
          printf 'publish=%s\nsha=%s\nversion=%s\ntag=v%s\nlibacde=%s\ntargets=%s\n' "$PUBLISH" "$sha" "$v" "$v" "$lib" "${left#,}" | tee -a "$GITHUB_OUTPUT"

  # per target on a Linux runner: the runtime (acdevrt-<triple>) and the host helper (acdevtools-<triple>);
  # Windows with cargo-xwin, macOS with cargo-zigbuild and the MacOSX15.5 SDK; Apple silicon on any aarch64-debian runner (user)
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-apple-darwin, cargo: zigbuild, runner: aarch64-debian }
          - { triple: x86_64-apple-darwin, cargo: zigbuild, runner: x86_64-debian }
          - { triple: x86_64-unknown-linux-gnu, cargo: build, runner: x86_64-debian }
          - { triple: x86_64-pc-windows-msvc, cargo: xwin build, runner: x86_64-debian }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    if: contains(format(',{0},', needs.plan.outputs.targets), format(',{0},', matrix.triple))
    env:
      T: ${{ matrix.triple }}
      V: ${{ needs.plan.outputs.version }}
      D: build-${{ matrix.triple }}
      SOURCES: ${{ needs.plan.outputs.sha }} ${{ needs.plan.outputs.libacde }} ${{ needs.plan.outputs.version }} ${{ matrix.triple }}
    steps:
      - &ssh
        name: the upload key for the artifacts host
        env:
          KEY: ${{ secrets.ARTIFACTS_UPLOAD_KEY }}
        run: |
          k=$RUNNER_TEMP/ssh
          mkdir -p -m 700 "$k"
          printf '%s\n' "$KEY" > "$k/key" && chmod 600 "$k/key"
          echo '192.168.10.127 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEO/zlouRrnjVdb3bSH9SH0ueof9pfb+KIDTLr0l6xyT' > "$k/known_hosts"
          echo "RSYNC_RSH=ssh -i $k/key -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=$k/known_hosts" >> "$GITHUB_ENV"
          # upload: rsync again when it fails, as when several jobs of this run reach the host at once
          # ("Another instance of rrsync is already accessing this directory", exit 12): up to 6 tries, 5 s more each time
          printf '%s\n' '#!/bin/sh' 'n=1' 'while :; do' '  rsync "$@" && exit 0' '  s=$?' '  [ "$n" -lt 6 ] || exit "$s"' \
            '  echo "upload: rsync exited $s (try $n of 6), again in $((n * 5)) s" >&2' '  sleep $((n * 5)); n=$((n + 1))' 'done' > "$k/upload"
          chmod 755 "$k/upload"
          echo "$k" >> "$GITHUB_PATH"
      - &reuse
        name: built already? (the run that built this key, recorded under built/ on the artifacts host, copied into this run)
        id: reuse
        run: |
          n=$D-$(printf '%s' "$SOURCES" | sha256sum | cut -c1-16)
          echo "record=$n" >> "$GITHUB_OUTPUT"
          was=$(printf 'acdev/built/%s\n' "$n" | nc $PULL | tar -xO 2>/dev/null || true)
          r=$RUNNER_TEMP/reuse
          rm -rf "$r" && mkdir -p "$r"
          case $was in '' | *[!0-9]*) was= ;; esac
          if [ -n "$was" ] && printf 'acdev/%s/%s\n' "$was" "$D" | nc $PULL | tar -x -C "$r" --strip-components=2 2>/dev/null &&
            [ -n "$(ls -A "$r/$D" 2>/dev/null)" ]; then
            upload -rt --mkpath --chmod=D755,F644 "$r/$D/" "$TO:$GITHUB_RUN_NUMBER/$D/"
            echo "$D: run $was built it, copied" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - &checkout
        if: steps.reuse.outputs.build == 'true'
        uses: http://gitea.dopamine/mirror/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acdev
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - &libacde
        if: steps.reuse.outputs.build == 'true'
        name: libacde beside acdev (the runtime library acdev links as ../libacde), with its vendor/blitz
        env:
          TOKEN: ${{ secrets.ACKERNEL_TOKEN }}
          REF: ${{ needs.plan.outputs.libacde }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          g() { git -c http.extraHeader="Authorization: basic ${auth}" "$@"; }
          rm -rf libacde
          g clone --quiet --depth 1 "$GITHUB_SERVER_URL/AC/libacde.git" libacde
          if [ "$(git -C libacde rev-parse HEAD)" != "$REF" ]; then
            g -C libacde fetch --quiet --depth 1 origin "$REF"
            git -C libacde checkout --quiet --detach "$REF"
          fi
          g -C libacde submodule update --init --depth 1
          echo "libacde $REF" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: acdev (dist profile, split debug information) and acdevtool
        if: steps.reuse.outputs.build == 'true'
        working-directory: acdev
        env:
          CARGO_REGISTRIES_AC_TOKEN: Bearer ${{ secrets.ACKERNEL_TOKEN }}
        run: |
          bun install --frozen-lockfile --cwd ../libacde/js
          sh scripts/set-version.sh "$V" .
          export ACDEV_BUN=$(command -v bun)
          RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$(rustc --print sysroot)=/rustc"
          export RUSTFLAGS="$RUSTFLAGS --remap-path-prefix=$PWD=/src --remap-path-prefix=$(cd ../libacde && pwd)=/libacde"
          case $T in
            *-windows-msvc)
              RUSTFLAGS="-C target-feature=+crt-static -C link-arg=/PDBALTPATH:%_PDB% $RUSTFLAGS"
              export XWIN_INCLUDE_ATL=true XWIN_CACHE_DIR=$HOME/.cache/cargo-xwin-atl ;;
            *-apple-darwin) export SDKROOT=/opt/cross/MacOSX15.5.sdk MACOSX_DEPLOYMENT_TARGET=11.0 ;;
          esac
          cargo ${{ matrix.cargo }} --locked --profile dist -p acdev --target $T
          (cd crates/tool && cargo ${{ matrix.cargo }} --locked --release --target $T)
      - name: the archives (one program each, fixed times and owner) and the split debug information, to the artifacts host
        if: steps.reuse.outputs.build == 'true'
        run: |
          case $T in *-windows-*) x=.exe ;; *) x= ;; esac
          mkdir -p out/symbols
          pack() {
            rm -rf one && mkdir one && cp "$2" "one/$3" && chmod 755 "one/$3" && TZ=UTC touch -t 200001010000.00 "one/$3"
            tar -C one --format=ustar --owner=0 --group=0 --numeric-owner -cf - "$3" > one.tar
            # Linux zstd -3 (install.sh asks for zstd); Windows 10's tar.exe reads neither xz nor zstd, macOS's bsdtar no zstd
            case $T in
              *-windows-*) gzip -9 -n -c one.tar > "out/$1-$T.tar.gz" ;;
              *-linux-*) zstd -q -T0 -3 -c one.tar > "out/$1-$T.tar.zst" ;;
              *) xz -9 -T1 -c one.tar > "out/$1-$T.tar.xz" ;;
            esac
          }
          pack acdevrt "acdev/target/$T/dist/acdev$x" "acdev$x"
          pack acdevtools "acdev/crates/tool/target/$T/release/acdevtool$x" "acdevtool$x"
          for part in acdev.pdb acdev.dwp acdev.dSYM; do [ ! -e "acdev/target/$T/dist/$part" ] || cp -RL "acdev/target/$T/dist/$part" out/symbols/; done
          [ -n "$(ls -A out/symbols)" ] || { echo "::error::no split debug information was produced"; exit 1; }
          ls -la out out/symbols
          upload -rt --mkpath --chmod=D755,F644 out/ "$TO:$GITHUB_RUN_NUMBER/build-$T/"
      - &record
        name: record this run as the one that built this key
        if: steps.reuse.outputs.build == 'true'
        run: |
          rm -rf built && mkdir built && echo "$GITHUB_RUN_NUMBER" > "built/${{ steps.reuse.outputs.record }}"
          upload -rt --mkpath --chmod=D755,F644 built/ "$TO:built/"

  # acdevd for both guest architectures (static musl, rust-lld per crates/devd/.cargo/config.toml) in acdev-guest-<version>
  guest:
    needs: plan
    runs-on: x86_64-debian
    timeout-minutes: 30
    env:
      D: guest
      SOURCES: ${{ needs.plan.outputs.sha }} ${{ needs.plan.outputs.version }}
    steps:
      - *ssh
      - *reuse
      - *checkout
      - name: acdevd-x86_64 and acdevd-aarch64, to the artifacts host
        if: steps.reuse.outputs.build == 'true'
        working-directory: acdev/crates/devd
        run: |
          s=$GITHUB_WORKSPACE/stage o=$GITHUB_WORKSPACE/out
          rm -rf "$s" "$o" && mkdir -p "$s" "$o"
          for a in x86_64 aarch64; do
            cargo build --locked --release --target $a-unknown-linux-musl
            cp "target/$a-unknown-linux-musl/release/acdevd" "$s/acdevd-$a"
          done
          (cd "$s" && chmod 755 * && TZ=UTC touch -t 200001010000.00 * &&
            tar --format=ustar --owner=0 --group=0 --numeric-owner -cf - acdevd-x86_64 acdevd-aarch64) | gzip -9 -n \
            > "$o/acdev-guest-${{ needs.plan.outputs.version }}.tar.gz"
          upload -rt --mkpath --chmod=D755,F644 "$o/" "$TO:$GITHUB_RUN_NUMBER/guest/"
      - *record

  # the release (out/: <version>/, latest, latest.json, install.*) from the builds, guarded, kept as <run>/acdev-release
  pkgs:
    needs: [plan, build, guest]
    if: ${{ !cancelled() && needs.guest.result == 'success' && needs.build.result != 'failure' }}
    runs-on: x86_64-debian
    env:
      V: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      TARGETS: ${{ needs.plan.outputs.targets }}
      D: acdev-release
      SOURCES: ${{ needs.plan.outputs.sha }} ${{ needs.plan.outputs.libacde }} ${{ needs.plan.outputs.version }} ${{ needs.plan.outputs.targets }}
    steps:
      - *ssh
      - *reuse
      - *checkout
      - *libacde
      - name: dist (the CLI archive, the SDK from libacde/acde-api, the built archives beside them) and latest.json
        if: steps.reuse.outputs.build == 'true'
        working-directory: acdev/npm
        run: |
          w=$GITHUB_WORKSPACE
          rm -rf "$w/in" "$w/shipped" && mkdir -p "$w/in" "$w/shipped"
          for d in guest $(echo "$TARGETS" | tr , '\n' | sed 's/^/build-/'); do
            printf 'acdev/%s/%s\n' "$GITHUB_RUN_NUMBER" "$d" | nc $PULL | tar -x -C "$w/in" --strip-components=2 2>/dev/null || true
            [ -d "$w/in/$d" ] || { echo "::error::the artifacts host has no $GITHUB_RUN_NUMBER/$d"; exit 1; }
          done
          cp "$w"/in/*/*.tar.* "$w/shipped/"
          bun install --frozen-lockfile
          sh ../scripts/set-version.sh "$V" ..
          bun scripts/dist.ts --api "$w/libacde/acde-api" --sdk "$V" --version "$V" --out "$w/out" --runtime "$w/shipped"
          cd "$w/out"
          jq -n --arg version "$V" --arg commit "$SHA" --argjson files "$(ls "$V" | jq -R . | jq -sc .)" \
            '{version: $version, tag: "v\($version)", commit: $commit, sdk: $version, base: "https://pkgs.dopame.ai/acdev/\($version)/", files: $files}' \
            | tee latest.json
          mkdir smoke && tar -xzf "$V/acdev-$V.tar.gz" -C smoke
          "smoke/acdev-$V/bin/acdev" --help 2>&1 | grep -q 'Usage: acdev <command>' || { echo "::error::bin/acdev does not start the CLI"; exit 1; }
          # --help loads no manifest code; check does (the contract levels, the validator), as a real command would
          mkdir smoke/app
          printf '<!doctype html><title>smoke</title>\n' > smoke/app/index.html
          printf '{"type": "app", "id": "smoke", "entry": "index.html", "capabilities": {}}\n' > smoke/app/acde.config.jsonc
          (cd smoke/app && "../acdev-$V/bin/acdev" check) || { echo "::error::acdev check fails from the archive"; exit 1; }
          rm -rf smoke
      - name: to the artifacts host (acdev-release, run.json)
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
          FRESH: ${{ steps.reuse.outputs.build }}
        run: |
          [ "$FRESH" != true ] || upload -rt --mkpath --chmod=D755,F644 out/ "$TO:$GITHUB_RUN_NUMBER/acdev-release/"
          mkdir -p run && printf '{"version":"%s","commit":"%s","publish":"%s","run":%s}\n' "$V" "$SHA" "$PUBLISH" "$GITHUB_RUN_NUMBER" > run/run.json
          upload -t --mkpath --chmod=F644 run/run.json "$TO:$GITHUB_RUN_NUMBER/"
          echo "artifacts: 192.168.10.127:/srv/artifacts/acdev/$GITHUB_RUN_NUMBER/" >> "$GITHUB_STEP_SUMMARY"
      - name: the release is exactly the allow-list and the shipped content is clean
        if: steps.reuse.outputs.build == 'true'
        working-directory: acdev/npm
        run: bun ../scripts/release-guard.ts --dir "$GITHUB_WORKSPACE/out" --version "$V" --targets "$TARGETS"
      - name: latest on the artifacts host
        run: |
          echo "$GITHUB_RUN_NUMBER" > run/latest
          upload -t --chmod=F644 run/latest "$TO:"
          [ "${{ needs.plan.outputs.publish }}" = true ] || echo "preview only, the archive passed the guard; no tag and no upload" >> "$GITHUB_STEP_SUMMARY"
      - name: record this run as the one that built this key, and its libacde for a publish of this commit and version
        if: steps.reuse.outputs.build == 'true'
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          LIB: ${{ needs.plan.outputs.libacde }}
        run: |
          rm -rf built && mkdir built && echo "$GITHUB_RUN_NUMBER" > "built/${{ steps.reuse.outputs.record }}"
          echo "$LIB" > "built/libacde-$SHA-$V"
          upload -rt --mkpath --chmod=D755,F644 built/ "$TO:built/"

  # R2 (every file once, never overwritten), the tag, the pointers, then npm
  publish:
    needs: [plan, pkgs]
    if: needs.plan.outputs.publish == 'true' && needs.pkgs.result == 'success'
    runs-on: x86_64-debian
    permissions:
      contents: write
    env:
      V: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: http://gitea.dopamine/mirror/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: acdev
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: true
      - name: the release from the artifacts host
        run: |
          rm -rf out && mkdir out
          printf 'acdev/%s/acdev-release\n' "$GITHUB_RUN_NUMBER" | nc $PULL | tar -x -C out --strip-components=3 2>/dev/null || true
          [ -f out/latest ] || { echo "::error::the artifacts host has no $GITHUB_RUN_NUMBER/acdev-release"; exit 1; }
          [ "$(cat out/latest)" = "$V" ] || { echo "::error::the release is $(cat out/latest), not $V"; exit 1; }
          (cd "out/$V" && sha256sum -c SHA256SUMS)
      # R2's S3 API with curl --aws-sigv4 (as AC/os scripts/r2.sh); the key reaches curl on stdin, not on its command line
      - name: the R2 helpers, sourced by the steps that hold the key
        run: |
          cat > "$RUNNER_TEMP/r2.sh" <<'EOF'
          [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${R2_ACCESS_KEY_ID:-}" ] && [ -n "${R2_SECRET_ACCESS_KEY:-}" ] ||
            { echo "::error::no R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secret"; exit 1; }
          endpoint=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com/$R2_BUCKET
          r2() { printf 'user = "%s:%s"\n' "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" | curl -K - --aws-sigv4 'aws:amz:auto:s3' --retry 3 "$@"; }
          put() { r2 -fsS -T "$2" -o /dev/null -H "Content-Type: $3" -H "Cache-Control: $4" "$endpoint/$1"; }
          get() {
            code=$(r2 -sS -o "$2" -w '%{http_code}' "$endpoint/$1") || code=000
            case $code in
              200) return 0 ;;
              404) rm -f "$2"; return 1 ;;
              *) echo "::error::GET $1: HTTP $code"; exit 1 ;;
            esac
          }
          EOF
      - name: upload every file SHA256SUMS lists, then SHA256SUMS, each read back
        working-directory: out/${{ needs.plan.outputs.version }}
        env: &keys
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          . "$RUNNER_TEMP/r2.sh"
          # a published version is identical or refused, never overwritten; a rerun skips the identical files
          publish_once() {
            case $1 in
              *.tar.gz) type=application/gzip ;;
              *.tar.xz) type=application/x-xz ;;
              *.tar.zst) type=application/zstd ;;
              *) type='text/plain; charset=utf-8' ;;
            esac
            key="$PREFIX/$V/$1"
            if get "$key" "$RUNNER_TEMP/published"; then
              cmp -s "$RUNNER_TEMP/published" "$1" || { echo "::error::$1 is already published with different content: a version is never overwritten"; exit 1; }
              echo "already published, identical: $1"
            else
              put "$key" "$1" "$type" 'public, max-age=31536000, immutable'
            fi
            get "$key" "$RUNNER_TEMP/readback" || { echo "::error::$1 is not there after the upload"; exit 1; }
            cmp -s "$RUNNER_TEMP/readback" "$1" || { echo "::error::$1 does not read back as uploaded"; exit 1; }
          }
          for f in $(awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS); do
            case $f in *[!A-Za-z0-9._-]*) echo "::error::bad file name $f"; exit 1 ;; esac
            publish_once "$f"
          done
          publish_once SHA256SUMS
      - name: the annotated tag points at the commit, or already does
        working-directory: acdev
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            peeled=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f 1)
            peeled=${peeled:-$(git ls-remote origin "refs/tags/$TAG" | cut -f 1)}
            [ "$peeled" = "$SHA" ] || { echo "::error::$TAG already exists and points at $peeled, not at $SHA: bump the version"; exit 1; }
            echo "$TAG already points at $SHA: a rerun continues"
          else
            git -c user.name=gitea-actions -c user.email=gitea-actions@gitea.dopamine tag -a "$TAG" -m "acdev $TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi
      # no CDN to invalidate: the Worker serves each object with its own Cache-Control, and the pointers' says revalidate
      - name: the pointers, latest.json last
        working-directory: out
        env: *keys
        run: |
          . "$RUNNER_TEMP/r2.sh"
          pointer() { put "$PREFIX/$1" "$1" "$2" 'public, max-age=0, must-revalidate'; }
          pointer install.sh 'text/plain; charset=utf-8'
          pointer install.ps1 'text/plain; charset=utf-8'
          pointer install.md 'text/markdown; charset=utf-8'
          pointer latest 'text/plain; charset=utf-8'
          pointer latest.json application/json
          printf 'curl -fsSL %s/install.sh | sh\n\nirm %s/install.ps1 | iex\n' "$PKGS/$PREFIX" "$PKGS/$PREFIX" >> "$GITHUB_STEP_SUMMARY"
      # @dopame/acdev (starts its platform package) and @dopame/acdev-<os>-<cpu> (laid out as an install); the SDK is not on npm
      - name: npm (platforms, then @dopame/acdev)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "${NPM_TOKEN:-}" ] || { echo "::warning::no NPM_TOKEN secret: nothing published to npm"; exit 0; }
          rel="$GITHUB_WORKSPACE/out/$V"
          deps=
          for t in $(echo "${{ needs.plan.outputs.targets }}" | tr , ' '); do
            case $t in
              x86_64-unknown-linux-gnu) os=linux cpu=x64 ;;
              aarch64-apple-darwin) os=darwin cpu=arm64 ;;
              x86_64-apple-darwin) os=darwin cpu=x64 ;;
              x86_64-pc-windows-msvc) os=win32 cpu=x64 ;;
            esac
            name="@dopame/acdev-$os-$cpu" dir="npm/acdev-$os-$cpu"
            mkdir -p "$dir.stage" "$dir/libexec"
            tar -xzf "$rel/acdev-$V.tar.gz" -C "$dir.stage" && cp -a "$dir.stage/acdev-$V/." "$dir/" && rm -rf "$dir.stage"
            for f in "$rel/acdevrt-$t".tar.* "$rel/acdevtools-$t".tar.* "$rel/acdev-guest-$V.tar.gz"; do tar -xf "$f" -C "$dir/libexec"; done
            node -e 'const [name,v,os,cpu]=process.argv.slice(1); process.stdout.write(JSON.stringify({name, version: v, description: `acdev for ${os}-${cpu}: the acdev runtime, the acdev CLI, the guest daemons and acdevtool`, license: "UNLICENSED", os: [os], cpu: [cpu], preferUnplugged: true}, null, 2) + "\n")' \
              "$name" "$V" "$os" "$cpu" > "$dir/package.json"
            deps="$deps\"$name\": \"$V\","
          done
          mkdir -p npm/acdev
          printf '%s\n' '#!/usr/bin/env node' \
            'import(`@dopame/acdev-${process.platform}-${process.arch}/lib/acdev/launcher.mjs`).then(async (m) => process.exit(await m.run(process.argv.slice(2))), (e) => { process.stderr.write(`acdev: no acdev for ${process.platform}-${process.arch} (${e.message})\n`); process.exit(1) })' \
            > npm/acdev/acdev.mjs
          node -e 'const [v,deps]=process.argv.slice(1); process.stdout.write(JSON.stringify({name: "@dopame/acdev", version: v, description: "acdev: build, run and debug acde apps", license: "UNLICENSED", type: "module", bin: {acde: "acdev.mjs"}, engines: {node: ">=22.3"}, optionalDependencies: JSON.parse(`{${deps.replace(/,$/, "")}}`)}, null, 2) + "\n")' \
            "$V" "$deps" > npm/acdev/package.json
          du -sh npm/*
          printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          for dir in npm/acdev-*-* npm/acdev; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$V" version > /dev/null 2>&1; then echo "$name@$V is already on npm"; continue; fi
            (cd "$dir" && npm publish --access public) && echo "published $name@$V"
          done

  # the pacman repository acdev beside the release (https://pkgs.dopame.ai/acdev/acdev.db, x86_64, flat): AC/os's
  # packages/acdev/PKGBUILD makes the package from this run's release on the artifacts host (its scripts/ci/acdev-package.sh),
  # its scripts/publish.sh adds it (checked out from AC/os, not copied here). A version the database already names is left
  # alone: makepkg's output differs from build to build, and a published package file is never overwritten.
  pacman:
    needs: [plan, publish]
    if: needs.plan.outputs.publish == 'true' && needs.publish.result == 'success' && contains(format(',{0},', needs.plan.outputs.targets), ',x86_64-unknown-linux-gnu,')
    runs-on: x86_64-arch
    timeout-minutes: 30
    env:
      V: ${{ needs.plan.outputs.version }}
    steps:
      # the x86_64-arch runners run jobs on the host as a user with sudo (as AC/os build.yaml installs its toolchain)
      - name: tools
        run: |
          missing=
          for t in dash repo-add bsdtar curl nc git makepkg fakeroot zstd; do
            command -v "$t" > /dev/null || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "installing for:$missing"
            for i in 1 2 3 4 5 6; do
              sudo pacman -Syu --noconfirm --needed dash pacman libarchive curl openbsd-netcat git fakeroot zstd && break
              [ "$i" -lt 6 ] || exit 1
              sleep 20
            done
          fi
      - name: the version in the repository already, or not
        id: db
        run: |
          db=$RUNNER_TEMP/acdev.db
          code=$(curl -sS -o "$db" -w '%{http_code}' "$PKGS/$PREFIX/$PREFIX.db") || code=000
          case $code in
            200) bsdtar -xOf "$db" '*/desc' | awk 'f { print; f = 0 } $0 == "%FILENAME%" { f = 1 }' > "$RUNNER_TEMP/named" ;;
            404) : > "$RUNNER_TEMP/named" ;;
            *) echo "::error::$PKGS/$PREFIX/$PREFIX.db: HTTP $code"; exit 1 ;;
          esac
          if grep -q "^acdev-$(printf '%s' "$V" | sed 's/\./\\./g')-[0-9.]*-x86_64\.pkg\.tar\.zst$" "$RUNNER_TEMP/named"; then
            echo "acdev $V is in the repository already: not built again" | tee -a "$GITHUB_STEP_SUMMARY"
            echo have=true >> "$GITHUB_OUTPUT"
          fi
      - name: os's packaging and publish scripts
        if: steps.db.outputs.have != 'true'
        env:
          TOKEN: ${{ secrets.ACKERNEL_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          rm -rf -- "$RUNNER_TEMP/os"
          git -c http.extraHeader="Authorization: basic ${auth}" clone --depth 1 "${GITHUB_SERVER_URL}/AC/os.git" "$RUNNER_TEMP/os"
          echo "os $(git -C "$RUNNER_TEMP/os" rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      # makepkg reads $XDG_CONFIG_HOME/pacman/makepkg.conf after /etc's (when MAKEPKG_CONF is unset): zstd -3 whatever the runner's default
      - name: the package (makepkg, zstd -3)
        if: steps.db.outputs.have != 'true'
        run: |
          conf=$RUNNER_TEMP/makepkg-config
          rm -rf -- "$conf" "$RUNNER_TEMP/package" && mkdir -p "$conf/pacman"
          printf '%s\n' "PKGEXT='.pkg.tar.zst'" 'COMPRESSZST=(zstd -c -T0 -3 -)' > "$conf/pacman/makepkg.conf"
          unset MAKEPKG_CONF PKGEXT
          XDG_CONFIG_HOME=$conf "$RUNNER_TEMP/os/scripts/ci/acdev-package.sh" "$RUNNER_TEMP/package" "$GITHUB_RUN_NUMBER"
          set -- "$RUNNER_TEMP"/package/acdev-"$V"-*-x86_64.pkg.tar.zst
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::acdev-package.sh made no acdev $V package"; ls -la "$RUNNER_TEMP/package"; exit 1; }
          echo "$(basename "$1"): $(du -h "$1" | cut -f 1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: publish
        if: steps.db.outputs.have != 'true'
        env: *keys
        run: |
          log=$RUNNER_TEMP/publish.log
          "$RUNNER_TEMP/os/scripts/publish.sh" acdev "$RUNNER_TEMP"/package/acdev-"$V"-*-x86_64.pkg.tar.zst > "$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          grep '^published ' "$log" >> "$GITHUB_STEP_SUMMARY"
      - name: clean up
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/os" "$RUNNER_TEMP/package" "$RUNNER_TEMP/makepkg-config" "$RUNNER_TEMP/publish.log" "$RUNNER_TEMP/acdev.db" "$RUNNER_TEMP/named"
